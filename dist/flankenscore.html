  <style>
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --text: #1c2420;
  --muted: #637068;
  --border: #dde3de;
  --primary: #1f7a4d;
  --primary-text: #ffffff;
  --accent: #f2b233;
  --hit: #1f9d55;
  --miss: #d64545;
  --side-a: #2c6fbb;
  --side-b: #c0612b;
  --highlight: #e7f4ec;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111613;
    --surface: #1a211d;
    --text: #e6ece8;
    --muted: #93a198;
    --border: #2d3831;
    --primary: #2f9e66;
    --highlight: #1f3328;
    --side-a: #5b9be0;
    --side-b: #e08a55;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}
a { color: var(--primary); }
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
h2 { font-size: 1.15rem; margin: 1.25rem 0 .6rem; }
h2:first-child { margin-top: 0; }
h3 { font-size: 1rem; margin: 0 0 .5rem; }
small, .muted { color: var(--muted); }
.small { font-size: .85rem; }
.error { color: var(--miss); font-weight: 600; }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: .6rem 1rem;
  background: var(--primary); color: var(--primary-text);
}
.brand { font-weight: 800; font-size: 1.25rem; color: inherit; text-decoration: none; letter-spacing: -.02em; }
.brand-text span { color: var(--accent); }
#nav { display: flex; align-items: center; gap: .25rem; margin-left: auto; flex-wrap: wrap; }
#nav > a {
  color: inherit; text-decoration: none; padding: .45rem .75rem; border-radius: 8px; font-weight: 500;
}
#nav > a.active, #nav > a:hover { background: rgba(255, 255, 255, .18); }
.menu { position: relative; }
.menu summary {
  list-style: none; cursor: pointer; padding: .3rem .8rem; border-radius: 8px; font-size: 1.3rem; line-height: 1;
}
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary, .menu summary:hover { background: rgba(255, 255, 255, .18); }
.menu > div {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px;
  display: flex; flex-direction: column; padding: .4rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
.menu > div button {
  background: none; border: 0; text-align: left; color: var(--text); padding: .6rem .75rem; border-radius: 8px; min-height: 0;
}
.menu > div button:hover { background: var(--highlight); }
.menu > div button.danger { color: var(--miss); }

/* ---------- Layout ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.1rem; margin-bottom: 1rem;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }

/* ---------- Formulare & Buttons ---------- */
label { display: flex; flex-direction: column; gap: .3rem; font-weight: 500; }
label.inline { flex-direction: row; align-items: center; gap: .5rem; margin-bottom: .6rem; }
label.inline input { width: 5rem; }
label.toggle { flex-direction: row; align-items: center; gap: .5rem; cursor: pointer; }
label.toggle input { width: 1.3rem; height: 1.3rem; accent-color: var(--primary); }
input:not([type=checkbox]) {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem; min-height: 44px; width: 100%;
}
input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: .55rem 1rem;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
button.secondary { background: var(--bg); }
button.small { min-height: 36px; padding: .35rem .75rem; font-size: .9rem; }
button.big { font-size: 1.1rem; padding: .8rem 1.4rem; }
button.icon { position: absolute; top: .4rem; right: .4rem; min-height: 32px; width: 32px; padding: 0; border: 0; background: none; color: var(--muted); }

.team-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; margin-bottom: .8rem; }
.team-input {
  position: relative; display: flex; flex-direction: column; gap: .4rem;
  border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem; margin: 0;
}
.team-input legend { font-weight: 700; padding: 0 .3rem; }
.mode-info { margin: 1rem 0 .6rem; padding: .7rem .9rem; background: var(--highlight); border-radius: 8px; }

.tabs, .segmented { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs button.active, .segmented button.active { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.segmented button { flex: 1; }

/* ---------- Dashboard ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; justify-content: space-between; }
.hero p { margin: 0; }
.phase { font-weight: 700; color: var(--primary); font-size: 1.1rem; }
.podium ol { list-style: none; padding: 0; margin: 0; display: flex; gap: .8rem; flex-wrap: wrap; }
.podium li { padding: .7rem 1rem; border-radius: 10px; background: var(--highlight); font-weight: 700; }
.podium li span { color: var(--muted); }
.podium .place1 { background: var(--accent); color: #2b1d00; font-size: 1.2rem; }
.podium .place1 span { color: inherit; }
.groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }

/* ---------- Tabellen ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: .45rem .5rem; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; white-space: normal; }
.team-panel table th:first-child, .team-panel table td:first-child { text-align: left; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
tr.qualified td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
tr.dim { opacity: .5; }

/* ---------- Spiellisten ---------- */
.match-list { display: flex; flex-direction: column; gap: .4rem; }
.match-row {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ctx score" "teams score";
  gap: .1rem .8rem; align-items: center; padding: .6rem .8rem;
  border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: inherit;
}
.match-row:hover { background: var(--highlight); }
.match-row .ctx { grid-area: ctx; font-size: .8rem; color: var(--muted); }
.match-row .teams { grid-area: teams; display: flex; gap: .5rem; flex-wrap: wrap; font-weight: 600; }
.match-row .score, .match-row .badge { grid-area: score; }
.score { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.vs { color: var(--muted); font-weight: 400; }
.win { color: var(--primary); }
.badge { font-size: .75rem; font-weight: 700; padding: .2rem .5rem; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.badge.live { background: var(--accent); color: #2b1d00; border-color: var(--accent); }
.badge.done { background: var(--highlight); color: var(--primary); }

/* ---------- K.o.-Baum ---------- */
.bracket { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: .5rem; }
.bcol { flex: 1 0 200px; display: flex; flex-direction: column; }
.bcol-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: .8rem; }
.bmatch {
  display: block; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  text-decoration: none; color: inherit; background: var(--surface);
}
.bmatch:hover { border-color: var(--primary); }
.bmatch.placeholder { opacity: .5; }
.bteam { display: flex; justify-content: space-between; gap: .5rem; padding: .45rem .7rem; }
.bteam + .bteam { border-top: 1px solid var(--border); }
.bteam.win { font-weight: 700; background: var(--highlight); }
.bteam.lose { color: var(--muted); }
.bstatus { padding: .3rem .7rem; border-top: 1px solid var(--border); }
.bthird { max-width: 260px; }
.series-score { display: flex; gap: 1rem; margin-bottom: 1rem; }
.series-score div { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: .8rem 1rem; background: var(--highlight); border-radius: 10px; font-weight: 700; }
.series-score b { font-size: 1.8rem; }
.seeds { columns: 2; margin: 0; }

/* ---------- Match ---------- */
.match-head h1 { margin: .3rem 0 .6rem; }
.match-head .ctx { color: var(--muted); font-size: .9rem; display: flex; gap: .5rem; align-items: center; }
.sides { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.side { padding: .3rem .7rem; border-radius: 99px; font-weight: 600; font-size: .9rem; color: #fff; }
.side-a { background: var(--side-a); }
.side-b { background: var(--side-b); }
.order-box { border: 1px solid var(--border); border-radius: 10px; padding: .8rem; }
.order-box ol { margin: 0 0 .6rem; padding-left: 1.3rem; font-weight: 600; }

.team-panel { border: 2px solid var(--border); border-radius: var(--radius); padding: .8rem; transition: border-color .15s, background .15s; }
.team-panel.active { border-color: var(--primary); background: var(--highlight); }
.team-panel.winner { border-color: var(--accent); }
.counters { display: flex; gap: .5rem; margin-bottom: .6rem; }
.counters div { flex: 1; text-align: center; background: var(--bg); border-radius: 8px; padding: .4rem; }
.counters b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.counters span { font-size: .75rem; color: var(--muted); }
.players { display: flex; gap: .4rem; flex-wrap: wrap; }
.player { padding: .35rem .7rem; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; }
.player.current { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

.throw-box { margin-top: 1rem; }
.next-label { font-size: 1.1rem; margin-bottom: .6rem; text-align: center; }
.throw-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.throw-buttons button { min-height: 88px; font-size: 1.4rem; border: 0; color: #fff; }
.throw-buttons .hit { background: var(--hit); }
.throw-buttons .miss { background: var(--miss); }
.throw-buttons button:active { transform: scale(.98); }
.throw-tools { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
.throw-log { list-style: none; padding: 0; margin: .8rem 0 0; display: flex; gap: .4rem; flex-wrap: wrap; font-size: .85rem; }
.throw-log li { background: var(--bg); border-radius: 99px; padding: .2rem .6rem; }
.throw-log li span { color: var(--muted); }
b.hit { color: var(--hit); }
b.miss { color: var(--miss); }
.end-box { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
.end-box .segmented { margin-bottom: 0; }

/* Landscape-Modus für Match-Tracking (7.4) */
@media (orientation: landscape) and (max-height: 560px) {
  body.in-match .topbar { position: static; }
  body.in-match .match-head { padding: .6rem 1rem; }
  body.in-match .match-head h1 { font-size: 1.2rem; margin: .1rem 0 .3rem; }
  body.in-match .live .panels { grid-template-columns: 1fr 1fr; gap: .6rem; }
  body.in-match .counters b { font-size: 1.2rem; }
  body.in-match .throw-buttons button { min-height: 64px; }
}

@media (max-width: 600px) {
  main { padding: .6rem; }
  .card { padding: .9rem; }
  .topbar { padding: .5rem .6rem; }
  #nav { margin-left: 0; width: 100%; }
  #nav > a { padding: .4rem .55rem; font-size: .95rem; }
  .menu { margin-left: auto; }
  .seeds { columns: 1; }
}

/* ---------- Druck (6.6) ---------- */
@media print {
  :root { --bg: #fff; --surface: #fff; --text: #000; --highlight: #eee; }
  .no-print, .actions, button, .throw-box, .end-box, .tabs { display: none !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .card { border: 0; padding: 0 0 1rem; break-inside: avoid; }
  .bracket { overflow: visible; flex-wrap: wrap; }
  a { color: inherit; text-decoration: none; }
}

/* ---------- Verwarnungen & Strafen ---------- */
.penalty-box { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
.pen-types button { flex: 1 1 45%; font-size: .95rem; }
.pen-targets { padding: .8rem; margin-bottom: .8rem; border-radius: 10px; background: var(--highlight); }
.pen-targets p { margin: 0 0 .5rem; }
.pen-targets .grid2 { margin-bottom: .6rem; }
.penalty-list { list-style: none; padding: 0; margin: .4rem 0 0; display: flex; flex-direction: column; gap: .3rem; }
.penalty-list li { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .35rem .6rem; border-radius: 8px; background: var(--bg); border-left: 4px solid var(--accent); }
.penalty-list li.pen-skip_player, .penalty-list li.pen-skip_team { border-left-color: var(--side-a); }
.penalty-list li.pen-strafhalbe { border-left-color: var(--miss); }
.penalty-list small { color: var(--muted); }
.pen-icon { width: 1.8rem; text-align: center; }
button.icon-inline { margin-left: auto; min-height: 32px; width: 32px; padding: 0; border: 0; background: none; color: var(--muted); }
.warn-badge { color: #b27800; font-size: .85em; margin-left: .2rem; }
.player.current .warn-badge { color: var(--accent); }
@media print { .penalty-box { display: none; } }

.ban-state { font-size: .85rem; font-weight: 600; }
.ban-state.open { color: var(--miss); }
.ban-state.done { color: var(--muted); font-weight: 400; }
.ban-badge { margin-left: .2rem; font-size: .85em; }

/* ---------- Logo ---------- */
.brand { display: inline-flex; align-items: center; gap: .5rem; }
.brand-logo { height: 38px; width: auto; padding: 2px 4px; border-radius: 8px; background: #f3f5f2; }
@media (max-width: 600px) { .brand-logo { height: 32px; } }

</style>
</head>

  var MODES = {

    3:  { groups: [3], legs: 2, qualifiers: 2, thirdPlace: false },
    4:  { groups: [4], legs: 2, qualifiers: 2, thirdPlace: true },
    5:  { groups: [5], legs: 1, qualifiers: 4, thirdPlace: true },
    6:  { groups: [3, 3], legs: 2, qualifiers: 4, thirdPlace: true },
    7:  { groups: [7], legs: 1, qualifiers: 4, thirdPlace: true },
    8:  { groups: [4, 4], legs: 1, qualifiers: 4, thirdPlace: false },
    9:  { groups: [3, 3, 3], legs: 1, qualifiers: 8, thirdPlace: true },
    10: { groups: [5, 5], legs: 1, qualifiers: 4, thirdPlace: false },
    11: { groups: [4, 4, 3], legs: 1, qualifiers: 8, thirdPlace: true },
    12: { groups: [4, 4, 4], legs: 1, qualifiers: 8, thirdPlace: false }
  };
  var MIN_TEAMS = 2, MAX_TEAMS = 12;
  var STAGE_NAMES = { 8: 'Viertelfinale', 4: 'Halbfinale', 2: 'Finale' };

  function getMode(teamCount) { return MODES[teamCount] || null; }

  function describeMode(teamCount) {
    var m = getMode(teamCount);
    if (!m) return 'Nicht unterstützt (2–12 Teams)';
    if (m.series) return 'Best of ' + m.series;
    var g = m.groups.length === 1 ? '1 Gruppe' : m.groups.length + ' Gruppen (' + m.groups.join('/') + ')';
    var fmt = m.legs === 2 ? 'Hin- & Rückrunde' : 'jeder gegen jeden';
    var ko = [];
    for (var n = m.qualifiers; n >= 2; n /= 2) ko.push(STAGE_NAMES[n]);
    var perGroup = Math.floor(m.qualifiers / m.groups.length);
    var ll = m.qualifiers - perGroup * m.groups.length;
    return g + ', ' + fmt + ' → ' + ko.join(', ') + (ll ? ' (+' + ll + ' Lucky Loser)' : '');
  }

  /* ---------- Round-Robin (Kreis-Methode) ---------- */
  function roundRobin(ids) {
    var list = ids.slice();
    if (list.length % 2) list.push(null);
    var n = list.length, rounds = [];
    for (var r = 0; r < n - 1; r++) {
      var pairs = [];
      for (var i = 0; i < n / 2; i++) {
        var a = list[i], b = list[n - 1 - i];
        if (a && b) pairs.push(r % 2 ? [b, a] : [a, b]);
      }
      rounds.push(pairs);
      list.splice(1, 0, list.pop());
    }
    return rounds;
  }

  /* ---------- 4. Seitenvergabe ---------- */
  function sideCounts(state, teamId) {
    var a = 0, b = 0;
    state.matches.forEach(function (m) {
      var side = m.homeTeamId === teamId ? m.sideAssignment.homeTeamSide
        : m.awayTeamId === teamId ? m.sideAssignment.awayTeamSide : null;
      if (side === 'side_a') a++; else if (side === 'side_b') b++;
    });
    return { teamId: teamId, sideA_count: a, sideB_count: b, difference: a - b };
  }

  // 4.2: Wer öfter auf A war, spielt auf B. Gleichstand: höher gesetztes Team
  // (niedrigerer seed) bzw. alphabetisch bekommt A.
  function assignSides(state, homeId, awayId, tiebreakHomeA) {
    var h = sideCounts(state, homeId).difference, w = sideCounts(state, awayId).difference;
    var homeA;
    if (h !== w) homeA = h < w;
    else if (typeof tiebreakHomeA === 'boolean') homeA = tiebreakHomeA;
    else {
      var ht = teamById(state, homeId), at = teamById(state, awayId);
      var hs = ht.seed == null ? Infinity : ht.seed, as = at.seed == null ? Infinity : at.seed;
      homeA = hs !== as ? hs < as : ht.name.localeCompare(at.name, 'de') <= 0;
    }
    return homeA ? { homeTeamSide: 'side_a', awayTeamSide: 'side_b' }
                 : { homeTeamSide: 'side_b', awayTeamSide: 'side_a' };
  }

  /* ---------- Hilfsfunktionen ---------- */
  function teamById(state, id) { return state.teams.find(function (t) { return t.id === id; }); }
  function playerById(state, id) { return state.players.find(function (p) { return p.id === id; }); }
  function matchById(state, id) { return state.matches.find(function (m) { return m.id === id; }); }
  function quote(hits, throws) { return throws ? hits / throws : 0; }

  function newMatch(state, opts) {
    var m = {
      id: uuid(),
      tournamentId: state.tournament.id,
      groupId: opts.groupId || null,
      knockoutStageId: opts.knockoutStageId || null,
      slot: opts.slot != null ? opts.slot : null,
      label: opts.label || null,
      homeTeamId: opts.homeTeamId,
      awayTeamId: opts.awayTeamId,
      sideAssignment: null,
      result: null,
      throwSequence: [],
      playerOrder: null,
      startingTeamId: null,
      status: 'not_started',
      createdAt: now(),
      updatedAt: now()
    };
    m.sideAssignment = assignSides(state, m.homeTeamId, m.awayTeamId, opts.tiebreakHomeA);
    state.matches.push(m);
    return m;
  }

  /* ---------- Turnier erstellen ---------- */
  // input: { name, date, thirdPlace, teams: [{ name, players: [name, name] }] }
  function createTournament(input) {
    var count = input.teams.length;
    var mode = getMode(count);
    if (!mode) throw new Error('Es werden 2 bis 12 Teams unterstützt.');
    var t = {
      id: uuid(),
      name: input.name,
      date: input.date,
      mode: mode.series ? 'knockout' : mode.groups.length ? 'groups_with_knockout' : 'group',
      teamCount: count,
      status: 'in_progress',
      config: {
        groups: mode.groups.slice(),
        legs: mode.legs || 0,
        qualifiers: mode.qualifiers || 0,
        series: mode.series || 0,
        thirdPlace: input.thirdPlace != null ? !!input.thirdPlace : !!mode.thirdPlace
      },
      settings: { autoSwitch: true },
      groups: [],
      knockoutStages: [],
      createdAt: now(),
      updatedAt: now()
    };
    var state = { tournament: t, teams: [], players: [], matches: [] };

    input.teams.forEach(function (ti) {
      var team = { id: uuid(), tournamentId: t.id, name: ti.name, players: [], seed: null, createdAt: now() };
      ti.players.forEach(function (pn) {
        var p = { id: uuid(), teamId: team.id, name: pn, createdAt: now() };
        state.players.push(p);
        team.players.push(p.id);
      });
      state.teams.push(team);
    });

    if (mode.series) {
      var st = { id: uuid(), tournamentId: t.id, stageName: 'Best of ' + mode.series, kind: 'series', size: 2, createdAt: now() };
      t.knockoutStages.push(st);
      newMatch(state, { knockoutStageId: st.id, homeTeamId: state.teams[0].id, awayTeamId: state.teams[1].id, label: 'Spiel 1', slot: 0 });
      return state;
    }

    // Teams zufällig auf Gruppen verteilen
    var shuffled = state.teams.map(function (x) { return x.id; });
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    var idx = 0;
    mode.groups.forEach(function (size, gi) {
      t.groups.push({
        id: uuid(), tournamentId: t.id,
        name: 'Gruppe ' + String.fromCharCode(65 + gi),
        teamIds: shuffled.slice(idx, idx + size),
        createdAt: now()
      });
      idx += size;
    });

    // Spielplan: Runden gruppenübergreifend verschränken, damit alle Gruppen parallel laufen
    var legs = [];
    t.groups.forEach(function (g) {
      var rounds = roundRobin(g.teamIds);
      var all = rounds.slice();
      if (mode.legs === 2) all = all.concat(rounds.map(function (r) { return r.map(function (p) { return [p[1], p[0]]; }); }));
      legs.push({ g: g, rounds: all, first: rounds.length });
    });
    var maxRounds = Math.max.apply(null, legs.map(function (l) { return l.rounds.length; }));
    var matchday = 1;
    for (var r = 0; r < maxRounds; r++) {
      legs.forEach(function (l) {
        (l.rounds[r] || []).forEach(function (pair) {
          var tiebreak;
          if (r >= l.first) {
            // Rückspiel: Seiten gegenüber dem Hinspiel tauschen
            var first = state.matches.find(function (m) {
              return m.groupId === l.g.id && m.homeTeamId === pair[1] && m.awayTeamId === pair[0];
            });
            if (first) tiebreak = first.sideAssignment.awayTeamSide === 'side_a';
          }
          var m = newMatch(state, { groupId: l.g.id, homeTeamId: pair[0], awayTeamId: pair[1], tiebreakHomeA: tiebreak });
          m.matchday = matchday + r;
        });
      });
    }
    return state;
  }

  /* ---------- Ergebnis & Statistik ---------- */
  function matchTotals(match) {
    var tot = {};
    tot[match.homeTeamId] = { hits: 0, throws: 0 };
    tot[match.awayTeamId] = { hits: 0, throws: 0 };
    match.throwSequence.forEach(function (e) {
      var x = tot[e.teamId];
      if (!x) return;
      x.throws++;
      if (e.isHit) x.hits++;
    });
    return tot;
  }

  function buildResult(match, winnerTeamId) {
    var tot = matchTotals(match), h = tot[match.homeTeamId], a = tot[match.awayTeamId];
    return {
      winnerTeamId: winnerTeamId,
      homeTeamHits: h.hits, homeTeamThrows: h.throws,
      awayTeamHits: a.hits, awayTeamThrows: a.throws,
      homeTeamQuote: quote(h.hits, h.throws),
      awayTeamQuote: quote(a.hits, a.throws)
    };
  }

  function emptyTeamStats(teamId) {
    return { teamId: teamId, points: 0, matchesPlayed: 0, wins: 0, losses: 0, hitsTotal: 0, throwsTotal: 0, hitQuote: 0 };
  }
  function addMatchToTeamStats(s, m) {
    if (m.status !== 'completed' || !m.result) return;
    var home = m.homeTeamId === s.teamId;
    if (!home && m.awayTeamId !== s.teamId) return;
    s.matchesPlayed++;
    if (m.result.winnerTeamId === s.teamId) { s.wins++; s.points++; } else s.losses++;
    s.hitsTotal += home ? m.result.homeTeamHits : m.result.awayTeamHits;
    s.throwsTotal += home ? m.result.homeTeamThrows : m.result.awayTeamThrows;
    s.hitQuote = quote(s.hitsTotal, s.throwsTotal);
  }

  // 5.3: Punkte ↓, Quote ↓, alphabetisch
  function compareStandings(state) {
    return function (a, b) {
      return (b.points - a.points) || (b.hitQuote - a.hitQuote) ||
        teamById(state, a.teamId).name.localeCompare(teamById(state, b.teamId).name, 'de');
    };
  }

  function groupStandings(state, group) {
    var rows = group.teamIds.map(emptyTeamStats);
    state.matches.forEach(function (m) {
      if (m.groupId !== group.id) return;
      rows.forEach(function (r) { addMatchToTeamStats(r, m); });
    });
    rows.sort(compareStandings(state));
    rows.forEach(function (r, i) { r.rank = i + 1; r.groupId = group.id; });
    return rows;
  }

  function teamStats(state) {
    var rows = state.teams.map(function (t) { var r = emptyTeamStats(t.id); r.penalties = emptyPenaltyCounts(); return r; });
    state.matches.forEach(function (m) {
      rows.forEach(function (r) { addMatchToTeamStats(r, m); });
      (m.penalties || []).forEach(function (p) {
        var r = rows.find(function (x) { return x.teamId === p.teamId; });
        if (r) r.penalties[p.type]++;
      });
    });
    return rows.sort(compareStandings(state));
  }

  function playerStats(state) {
    var map = {};
    state.players.forEach(function (p) {
      map[p.id] = { playerId: p.id, name: p.name, teamId: p.teamId, throwsTotal: 0, hitsTotal: 0, hitQuote: 0,
        matchesPlayed: 0, wins: 0, losses: 0, throwsByMatch: {}, hitsByMatch: {}, penalties: emptyPenaltyCounts() };
    });
    state.matches.forEach(function (m) {
      m.throwSequence.forEach(function (e) {
        var s = map[e.playerId];
        if (!s) return;
        s.throwsTotal++;
        s.throwsByMatch[m.id] = (s.throwsByMatch[m.id] || 0) + 1;
        if (e.isHit) { s.hitsTotal++; s.hitsByMatch[m.id] = (s.hitsByMatch[m.id] || 0) + 1; }
      });
      (m.penalties || []).forEach(function (p) { if (p.playerId && map[p.playerId]) map[p.playerId].penalties[p.type]++; });
      if (m.status !== 'completed' || !m.result) return;
      [m.homeTeamId, m.awayTeamId].forEach(function (tid) {
        teamById(state, tid).players.forEach(function (pid) {
          var s = map[pid];
          s.matchesPlayed++;
          if (m.result.winnerTeamId === tid) s.wins++; else s.losses++;
        });
      });
    });
    return Object.keys(map).map(function (k) {
      var s = map[k];
      s.hitQuote = quote(s.hitsTotal, s.throwsTotal);
      return s;
    });
  }

  // 5.4: Quote (mit Mindestwürfen) ↓, Treffer ↓
  function playerRanking(state, minThrows) {
    minThrows = minThrows == null ? 5 : minThrows;
    return playerStats(state).sort(function (a, b) {
      var qa = a.throwsTotal >= minThrows, qb = b.throwsTotal >= minThrows;
      if (qa !== qb) return qa ? -1 : 1;
      return (b.hitQuote - a.hitQuote) || (b.hitsTotal - a.hitsTotal) || a.name.localeCompare(b.name, 'de');
    });
  }

  /* ---------- Phasen & K.o. ---------- */
  function groupMatches(state) { return state.matches.filter(function (m) { return m.groupId; }); }
  function stageMatches(state, stageId) {
    return state.matches.filter(function (m) { return m.knockoutStageId === stageId; })
      .sort(function (a, b) { return a.slot - b.slot; });
  }
  function allDone(ms) { return ms.length > 0 && ms.every(function (m) { return m.status === 'completed'; }); }
  function winnerOf(m) { return m.result && m.result.winnerTeamId; }
  function loserOf(m) { return m.result && (m.result.winnerTeamId === m.homeTeamId ? m.awayTeamId : m.homeTeamId); }

  // 1.2/1.3: Gruppensieger, dann beste Zweite/Dritte (Lucky Loser)
  function qualifiers(state) {
    var t = state.tournament, Q = t.config.qualifiers, G = t.groups.length;
    var perGroup = Math.floor(Q / G);
    var tables = t.groups.map(function (g) { return groupStandings(state, g); });
    var chosen = [];
    tables.forEach(function (rows) { chosen = chosen.concat(rows.slice(0, perGroup)); });
    var rest = Q - chosen.length;
    var luckyLosers = [];
    if (rest > 0) {
      var pool = [];
      tables.forEach(function (rows) { if (rows[perGroup]) pool.push(rows[perGroup]); });
      pool.sort(crossGroupCompare(state));
      luckyLosers = pool.slice(0, rest);
      luckyLosers.forEach(function (r) { r.luckyLoser = true; });
      chosen = chosen.concat(luckyLosers);
    }
    // Setzliste: Platzierung in der Gruppe, dann Punkte/Spiel, Quote, Name
    chosen.sort(function (a, b) { return (a.rank - b.rank) || crossGroupCompare(state)(a, b); });
    return chosen;
  }
  // Gruppen können unterschiedlich groß sein (11 Teams) → Punkte pro Spiel vergleichen
  function crossGroupCompare(state) {
    return function (a, b) {
      var pa = a.matchesPlayed ? a.points / a.matchesPlayed : 0, pb = b.matchesPlayed ? b.points / b.matchesPlayed : 0;
      return (pb - pa) || (b.hitQuote - a.hitQuote) ||
        teamById(state, a.teamId).name.localeCompare(teamById(state, b.teamId).name, 'de');
    };
  }

  // Standard-Setzbaum: 1 und 2 treffen frühestens im Finale aufeinander
  function bracketOrder(n) {
    var order = [1];
    while (order.length < n) {
      var size = order.length * 2, next = [];
      order.forEach(function (s) { next.push(s, size + 1 - s); });
      order = next;
    }
    return order;
  }

  function firstRoundPairs(seeded) {
    var n = seeded.length, order = bracketOrder(n), pairs = [];
    for (var i = 0; i < n; i += 2) pairs.push([seeded[order[i] - 1], seeded[order[i + 1] - 1]]);
    // Gleiche Gruppe in Runde 1 vermeiden, indem die schwächer gesetzten Teams getauscht werden
    if (pairs.length > 1) {
      pairs.forEach(function (p, i) {
        if (p[0].groupId !== p[1].groupId) return;
        for (var j = pairs.length - 1; j >= 0; j--) {
          if (j === i) continue;
          var q = pairs[j];
          if (q[1].groupId !== p[0].groupId && p[1].groupId !== q[0].groupId) {
            var tmp = p[1]; p[1] = q[1]; q[1] = tmp;
            return;
          }
        }
      });
    }
    return pairs;
  }

  function addStage(state, size, kind) {
    var st = { id: uuid(), tournamentId: state.tournament.id, stageName: kind === 'third' ? 'Spiel um Platz 3' : STAGE_NAMES[size],
      kind: kind || 'main', size: size, createdAt: now() };
    state.tournament.knockoutStages.push(st);
    return st;
  }

  function mainStages(state) {
    return state.tournament.knockoutStages.filter(function (s) { return s.kind === 'main'; });
  }

  // Nach jeder Ergebnis-Änderung aufrufen: erzeugt ggf. nächste Runde / beendet Turnier
  function advance(state) {
    var t = state.tournament, changed = false;
    if (t.status === 'completed') return false;

    if (t.config.series) {
      var st = t.knockoutStages[0], ms = stageMatches(state, st.id);
      var need = Math.ceil(t.config.series / 2), wins = {};
      ms.forEach(function (m) { if (winnerOf(m)) wins[winnerOf(m)] = (wins[winnerOf(m)] || 0) + 1; });
      var champion = Object.keys(wins).find(function (k) { return wins[k] >= need; });
      if (champion) { t.status = 'completed'; return true; }
      if (allDone(ms)) {
        var last = ms[ms.length - 1];
        newMatch(state, { knockoutStageId: st.id, homeTeamId: last.awayTeamId, awayTeamId: last.homeTeamId,
          slot: ms.length, label: 'Spiel ' + (ms.length + 1) });
        return true;
      }
      return false;
    }

    var stages = mainStages(state);
    if (!stages.length) {
      if (!allDone(groupMatches(state))) return false;
      var seeded = qualifiers(state);
      seeded.forEach(function (row, i) { teamById(state, row.teamId).seed = i + 1; });
      var first = addStage(state, seeded.length);
      firstRoundPairs(seeded).forEach(function (p, i) {
        newMatch(state, { knockoutStageId: first.id, homeTeamId: p[0].teamId, awayTeamId: p[1].teamId, slot: i });
      });
      // Spiel um Platz 3 ohne Halbfinale (4 Teams): Gruppendritter gegen -vierter
      if (seeded.length === 2 && t.config.thirdPlace && t.groups.length === 1) {
        var table = groupStandings(state, t.groups[0]);
        if (table.length >= 4) {
          var third = addStage(state, 2, 'third');
          newMatch(state, { knockoutStageId: third.id, homeTeamId: table[2].teamId, awayTeamId: table[3].teamId, slot: 0 });
        }
      }
      return true;
    }

    var cur = stages[stages.length - 1], cms = stageMatches(state, cur.id);
    if (!allDone(cms)) return false;
    if (cur.size === 2) {
      var thirdStage = t.knockoutStages.find(function (s) { return s.kind === 'third'; });
      if (!thirdStage || allDone(stageMatches(state, thirdStage.id))) { t.status = 'completed'; changed = true; }
      return changed;
    }
    var next = addStage(state, cur.size / 2);
    for (var i = 0; i < cms.length; i += 2) {
      newMatch(state, { knockoutStageId: next.id, homeTeamId: winnerOf(cms[i]), awayTeamId: winnerOf(cms[i + 1]), slot: i / 2 });
    }
    if (cur.size === 4 && t.config.thirdPlace) {
      var ts = addStage(state, 2, 'third');
      newMatch(state, { knockoutStageId: ts.id, homeTeamId: loserOf(cms[0]), awayTeamId: loserOf(cms[1]), slot: 0 });
    }
    return true;
  }

  // Endplatzierung (1–3), sofern schon ermittelt
  function podium(state) {
    var t = state.tournament, res = [];
    if (t.config.series) {
      var st = t.knockoutStages[0], wins = {};
      stageMatches(state, st.id).forEach(function (m) { if (winnerOf(m)) wins[winnerOf(m)] = (wins[winnerOf(m)] || 0) + 1; });
      if (t.status !== 'completed') return res;
      var ids = state.teams.map(function (x) { return x.id; }).sort(function (a, b) { return (wins[b] || 0) - (wins[a] || 0); });
      return [{ place: 1, teamId: ids[0] }, { place: 2, teamId: ids[1] }];
    }
    var final = mainStages(state).find(function (s) { return s.size === 2; });
    var fm = final && stageMatches(state, final.id)[0];
    if (fm && fm.status === 'completed') res.push({ place: 1, teamId: winnerOf(fm) }, { place: 2, teamId: loserOf(fm) });
    var third = t.knockoutStages.find(function (s) { return s.kind === 'third'; });
    var tm = third && stageMatches(state, third.id)[0];
    if (tm && tm.status === 'completed') res.push({ place: 3, teamId: winnerOf(tm) });
    return res;
  }

  function phaseLabel(state) {
    var t = state.tournament;
    if (t.status === 'completed') return 'Turnier beendet';
    if (t.config.series) {
      var n = stageMatches(state, t.knockoutStages[0].id).length;
      return 'Best of ' + t.config.series + ', Spiel ' + n;
    }
    var stages = mainStages(state);
    if (!stages.length) {
      var open = groupMatches(state).filter(function (m) { return m.status !== 'completed'; });
      var day = open.length ? Math.min.apply(null, open.map(function (m) { return m.matchday; })) : '';
      return 'Gruppenphase' + (day ? ', Spieltag ' + day : '');
    }
    return stages[stages.length - 1].stageName;
  }

  var PENALTY_TYPES = {
    warning: 'Verwarnung',
    skip_player: 'Aussetzen',
    skip_team: 'Teamaussetzen',
    strafhalbe: 'Strafhalbe'
  };

  // Wurfreihenfolge: Teams werfen abwechselnd, innerhalb des Teams wird rotiert (3.2)
  function nextThrower(match) {
    if (!match.playerOrder || !match.startingTeamId) return null;
    var seq = match.throwSequence, last = seq[seq.length - 1];
    var teamId = last ? (last.teamId === match.homeTeamId ? match.awayTeamId : match.homeTeamId) : match.startingTeamId;
    var n = seq.filter(function (e) { return e.teamId === teamId; }).length;
    var order = match.playerOrder[teamId];
    return { teamId: teamId, playerId: order[n % order.length] };
  }

  // Aussetzen/Teamaussetzen: Spieler bzw. Team darf beim nächsten Treffer der eigenen
  // Mannschaft nicht trinken. Liefert den Wurf, bei dem die Strafe abgegolten wurde, sonst null.
  function drinkBanServedAt(match, penalty) {
    if (penalty.type !== 'skip_player' && penalty.type !== 'skip_team') return null;
    var seq = match.throwSequence;
    for (var i = penalty.beforeThrow; i < seq.length; i++) {
      if (seq[i].teamId === penalty.teamId && seq[i].isHit) return seq[i];
    }
    return null;
  }

  // Spieler, die beim nächsten Treffer ihres Teams nicht trinken dürfen
  function pendingDrinkBans(match, state) {
    var banned = {};
    (match.penalties || []).forEach(function (p) {
      if ((p.type !== 'skip_player' && p.type !== 'skip_team') || drinkBanServedAt(match, p)) return;
      var ids = p.type === 'skip_team' ? match.playerOrder[p.teamId] || teamById(state, p.teamId).players : [p.playerId];
      ids.forEach(function (id) { banned[id] = true; });
    });
    return banned;
  }

  function recordThrow(match, playerId, teamId, isHit) {
    match.throwSequence.push({ id: uuid(), matchId: match.id, playerId: playerId, teamId: teamId,
      throwNumber: match.throwSequence.length + 1, isHit: !!isHit, timestamp: now() });
    match.updatedAt = now();
  }

  function addPenalty(match, type, teamId, playerId) {
    if (!PENALTY_TYPES[type]) throw new Error('Unbekannte Strafe: ' + type);
    if (!match.penalties) match.penalties = [];
    match.penalties.push({ id: uuid(), matchId: match.id, type: type, teamId: teamId,
      playerId: type === 'skip_team' ? null : playerId, beforeThrow: match.throwSequence.length, timestamp: now() });
    match.updatedAt = now();
  }

  function removePenalty(match, penaltyId) {
    match.penalties = (match.penalties || []).filter(function (p) { return p.id !== penaltyId; });
    match.updatedAt = now();
  }

  // Letzte Eingabe (Wurf oder Strafe) zurücknehmen
  function undoLast(match) {
    var pens = match.penalties || [], lastPen = pens[pens.length - 1];
    var lastThrow = match.throwSequence[match.throwSequence.length - 1];
    if (lastPen && (!lastThrow || lastPen.timestamp >= lastThrow.timestamp)) pens.pop();
    else match.throwSequence.pop();
    match.updatedAt = now();
  }

  function emptyPenaltyCounts() { return { warning: 0, skip_player: 0, skip_team: 0, strafhalbe: 0 }; }

  // Stages, die von diesem Spiel abhängen (später erzeugt)
  function dependentStages(state, match) {
    var t = state.tournament;
    if (match.groupId) return t.knockoutStages.slice();
    var st = t.knockoutStages.find(function (s) { return s.id === match.knockoutStageId; });
    if (st.kind !== 'main') return [];
    return t.knockoutStages.filter(function (s) {
      return s.kind === 'main' ? s.size < st.size : st.size === 4 && s.kind === 'third';
    });
  }

  // Korrektur erlaubt, solange kein abhängiges Spiel begonnen wurde
  function canReopen(state, match) {
    if (match.status !== 'completed') return false;
    var st = state.tournament.knockoutStages.find(function (s) { return s.id === match.knockoutStageId; });
    if (st && st.kind === 'series') {
      var later = stageMatches(state, st.id).filter(function (m) { return m.slot > match.slot; });
      return later.every(function (m) { return m.status === 'not_started'; });
    }
    var ids = dependentStages(state, match).map(function (s) { return s.id; });
    return !state.matches.some(function (m) { return ids.indexOf(m.knockoutStageId) >= 0 && m.status !== 'not_started'; });
  }

  function reopen(state, match) {
    var t = state.tournament;
    var st = t.knockoutStages.find(function (s) { return s.id === match.knockoutStageId; });
    if (st && st.kind === 'series') {
      state.matches = state.matches.filter(function (m) { return !(m.knockoutStageId === st.id && m.slot > match.slot); });
    } else {
      var ids = dependentStages(state, match).map(function (s) { return s.id; });
      state.matches = state.matches.filter(function (m) { return ids.indexOf(m.knockoutStageId) < 0; });
      t.knockoutStages = t.knockoutStages.filter(function (s) { return ids.indexOf(s.id) < 0; });
      if (match.groupId) state.teams.forEach(function (x) { x.seed = null; });
    }
    match.status = 'in_progress';
    match.result = null;
    match.updatedAt = now();
    t.status = 'in_progress';
  }

  global.Flanken = {
    MODES: MODES, MIN_TEAMS: MIN_TEAMS, MAX_TEAMS: MAX_TEAMS,
    uuid: uuid, now: now, getMode: getMode, describeMode: describeMode,
    createTournament: createTournament, advance: advance,
    sideCounts: sideCounts, matchTotals: matchTotals, buildResult: buildResult,
    groupStandings: groupStandings, teamStats: teamStats, playerStats: playerStats, playerRanking: playerRanking,
    qualifiers: qualifiers, groupMatches: groupMatches, stageMatches: stageMatches, mainStages: mainStages,
    podium: podium, phaseLabel: phaseLabel, nextThrower: nextThrower, recordThrow: recordThrow,
    canReopen: canReopen, reopen: reopen,
    PENALTY_TYPES: PENALTY_TYPES, drinkBanServedAt: drinkBanServedAt, pendingDrinkBans: pendingDrinkBans, addPenalty: addPenalty, removePenalty: removePenalty, undoLast: undoLast,
    teamById: teamById, playerById: playerById, matchById: matchById, quote: quote,
    bracketOrder: bracketOrder
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* Flankenscore – Persistierung in localStorage (7.2) */
(function (global) {
  'use strict';
  var KEY = 'flankenscore_tournament';

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return validate(JSON.parse(raw));
    } catch (e) {
      console.warn('Gespeicherter Stand konnte nicht geladen werden', e);
      return null;
    }
  }

  function save(state) {
    if (!state) { try { localStorage.removeItem(KEY); } catch (e) { /* ignorieren */ } return; }
    state.tournament.updatedAt = Flanken.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }

  function validate(data) {
    if (!data || !data.tournament || !Array.isArray(data.teams) || !Array.isArray(data.matches) || !Array.isArray(data.players)) {
      throw new Error('Ungültige Turnierdatei');
    }
    return data;
  }

  function exportJson(state) {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    var safe = (state.tournament.name || 'turnier').replace(/[^\w\-äöüÄÖÜß]+/g, '_');
    a.href = URL.createObjectURL(blob);
    a.download = 'flankenscore_' + safe + '_' + (state.tournament.date || '') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  function importJson(file) {
    return file.text().then(function (txt) { return validate(JSON.parse(txt)); });
  }

  global.FlankenStore = { load: load, save: save, exportJson: exportJson, importJson: importJson };
})(window);

  <script>
/* Flankenscore – Oberfläche */
(function () {
  'use strict';
  var F = window.Flanken, Store = window.FlankenStore;
  var app = document.getElementById('app'), nav = document.getElementById('nav');
  var state = Store.load();
  var draft = null;          // Setup-Formular
  var ui = { group: 0, selectedThrower: null, minThrows: 5, penType: null };

  /* ---------- Helfer ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pct(q) { return (q * 100).toFixed(1).replace('.', ',') + ' %'; }
  function team(id) { return F.teamById(state, id); }
  function tname(id) { var t = id && team(id); return t ? esc(t.name) : '–'; }
  function pname(id) { var p = F.playerById(state, id); return p ? esc(p.name) : '–'; }
  function sideLabel(s) { return s === 'side_a' ? 'Links' : 'Rechts'; }
  function commit() { F.advance(state); Store.save(state); render(); }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function today() { return new Date().toISOString().slice(0, 10); }

  function newDraft() {
    return { name: '', date: today(), thirdPlace: null,
      teams: [0, 1, 2, 3].map(function () { return { name: '', players: ['', ''] }; }) };
  }

  function matchContext(m) {
    if (m.groupId) {
      var g = state.tournament.groups.find(function (x) { return x.id === m.groupId; });
      return g.name + ' · Spieltag ' + m.matchday;
    }
    var st = state.tournament.knockoutStages.find(function (s) { return s.id === m.knockoutStageId; });
    return st.stageName + (m.label ? ' · ' + m.label : '');
  }

  function statusBadge(m) {
    return { not_started: '<span class="badge">offen</span>', in_progress: '<span class="badge live">läuft</span>',
      completed: '<span class="badge done">fertig</span>' }[m.status];
  }

  function matchRow(m) {
    var r = m.result, w = r && r.winnerTeamId;
    var score = r ? '<span class="score">' + r.homeTeamHits + ':' + r.awayTeamHits + '</span>' : statusBadge(m);
    return '<a class="match-row" href="#/match/' + m.id + '">' +
      '<span class="ctx">' + esc(matchContext(m)) + '</span>' +
      '<span class="teams"><span class="' + (w === m.homeTeamId ? 'win' : '') + '">' + tname(m.homeTeamId) + '</span>' +
      '<span class="vs">vs</span><span class="' + (w === m.awayTeamId ? 'win' : '') + '">' + tname(m.awayTeamId) + '</span></span>' +
      score + '</a>';
  }

  function openMatches() {
    var ms = state.matches.filter(function (m) { return m.status !== 'completed'; });
    return ms.sort(function (a, b) {
      if (a.status !== b.status) return a.status === 'in_progress' ? -1 : 1;
      return (a.matchday || 0) - (b.matchday || 0);
    });
  }

  /* ---------- Navigation ---------- */
  function renderNav(route) {
    if (!state) { nav.innerHTML = ''; return; }
    var hasGroups = state.tournament.groups.length > 0;
    var links = [['', 'Übersicht']];
    if (hasGroups) links.push(['groups', 'Gruppen']);
    links.push(['ko', hasGroups ? 'K.o.' : 'Spiele'], ['stats', 'Statistik']);
    nav.innerHTML = links.map(function (l) {
      return '<a href="#/' + l[0] + '" class="' + (route === l[0] ? 'active' : '') + '">' + l[1] + '</a>';
    }).join('') +
      '<details class="menu"><summary aria-label="Menü">⋯</summary><div>' +
      '<button data-action="export">JSON exportieren</button>' +
      '<button data-action="import">JSON importieren</button>' +
      '<button data-action="print">Drucken / PDF</button>' +
      '<button data-action="export-players">Spielerstatistik (CSV)</button>' +
      '<button data-action="new" class="danger">Neues Turnier</button>' +
      '</div></details>';
  }

  var PEN_ICONS = { warning: '⚠', skip_player: '⏸', skip_team: '⏸⏸', strafhalbe: '🍺' };

  function penaltyTarget(p) { return p.playerId ? pname(p.playerId) + ' (' + tname(p.teamId) + ')' : tname(p.teamId); }

  function penaltyList(m, removable) {
    var pens = m.penalties || [];
    if (!pens.length) return '<p class="muted small">Keine Verwarnungen oder Strafen.</p>';
    return '<ul class="penalty-list">' + pens.slice().reverse().map(function (p) {
      return '<li class="pen-' + p.type + '"><span class="pen-icon">' + PEN_ICONS[p.type] + '</span><strong>' + F.PENALTY_TYPES[p.type] +
        '</strong> ' + penaltyTarget(p) + ' <small>vor Wurf ' + (p.beforeThrow + 1) + '</small>' + drinkBanState(m, p) +
        (removable ? '<button class="icon-inline" data-action="pen-del" data-id="' + m.id + '" data-pen="' + p.id + '" aria-label="Eintrag löschen">✕</button>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  function drinkBanState(m, p) {
    if (p.type !== 'skip_player' && p.type !== 'skip_team') return '';
    var served = F.drinkBanServedAt(m, p);
    return served ? ' <span class="ban-state done">✓ nicht getrunken bei Treffer #' + served.throwNumber + '</span>'
      : ' <span class="ban-state open">🚫 beim nächsten Treffer nicht trinken</span>';
  }

  function banBadge(m, pid) {
    return m.status === 'in_progress' && F.pendingDrinkBans(m, state)[pid]
      ? ' <span class="ban-badge" title="Darf beim nächsten Treffer nicht trinken">🚫</span>' : '';
  }

  function warnBadge(m, pid) {
    var n = (m.penalties || []).filter(function (p) { return p.type === 'warning' && p.playerId === pid; }).length;
    return n ? ' <span class="warn-badge" title="Verwarnungen">⚠' + (n > 1 ? n : '') + '</span>' : '';
  }

  function penaltyBox(m) {
    var html = '<div class="penalty-box"><h2>Verwarnungen &amp; Strafen</h2><div class="segmented pen-types">' +
      Object.keys(F.PENALTY_TYPES).map(function (k) {
        return '<button data-action="pen-type" data-type="' + k + '" class="' + (ui.penType === k ? 'active' : '') + '">' +
          PEN_ICONS[k] + ' ' + F.PENALTY_TYPES[k] + '</button>';
      }).join('') + '</div>';
    if (ui.penType) {
      html += '<div class="pen-targets"><p class="small">' + F.PENALTY_TYPES[ui.penType] + ' für:</p><div class="grid2">' +
        [m.homeTeamId, m.awayTeamId].map(function (tid) {
          if (ui.penType === 'skip_team') {
            return '<button class="secondary" data-action="pen-add" data-id="' + m.id + '" data-team="' + tid + '">' + tname(tid) + '</button>';
          }
          return '<div><h3>' + tname(tid) + '</h3><div class="players">' + m.playerOrder[tid].map(function (pid) {
            return '<button class="player" data-action="pen-add" data-id="' + m.id + '" data-team="' + tid + '" data-player="' + pid + '">' + pname(pid) + '</button>';
          }).join('') + '</div></div>';
        }).join('') + '</div><button class="secondary small" data-action="pen-type" data-type="">Abbrechen</button></div>';
    }
    return html + penaltyList(m, true) + '</div>';
  }

  /* ---------- 6.1 Setup ---------- */
  function viewSetup() {
    if (!draft) draft = newDraft();
    var n = draft.teams.length, mode = F.getMode(n);
    var third = draft.thirdPlace != null ? draft.thirdPlace : !!(mode && mode.thirdPlace);
    var canThird = mode && !mode.series && (mode.qualifiers >= 4 || n >= 4);
    return '<section class="card"><h1>Turnier erstellen</h1>' +
      '<div class="grid2">' +
      '<label>Turniername<input data-bind="name" value="' + esc(draft.name) + '" placeholder="z.B. Sommer-Flanki 2026"></label>' +
      '<label>Datum<input type="date" data-bind="date" value="' + esc(draft.date) + '"></label>' +
      '</div>' +
      '<h2>Teams <small>(' + n + ')</small></h2>' +
      '<div class="team-inputs">' + draft.teams.map(function (t, i) {
        return '<fieldset class="team-input"><legend>Team ' + (i + 1) + '</legend>' +
          '<input data-bind="team" data-i="' + i + '" value="' + esc(t.name) + '" placeholder="Teamname">' +
          '<input data-bind="player" data-i="' + i + '" data-p="0" value="' + esc(t.players[0]) + '" placeholder="Spieler 1">' +
          '<input data-bind="player" data-i="' + i + '" data-p="1" value="' + esc(t.players[1]) + '" placeholder="Spieler 2">' +
          (n > F.MIN_TEAMS ? '<button class="icon" data-action="remove-team" data-i="' + i + '" aria-label="Team entfernen">✕</button>' : '') +
          '</fieldset>';
      }).join('') + '</div>' +
      (n < F.MAX_TEAMS ? '<button data-action="add-team" class="secondary">+ Team hinzufügen</button>' : '') +
      '<div class="mode-info"><strong>Modus:</strong> ' + esc(F.describeMode(n)) + '</div>' +
      (canThird ? '<label class="toggle"><input type="checkbox" data-bind="thirdPlace"' + (third ? ' checked' : '') + '> Spiel um Platz 3</label>' : '') +
      '<p id="setup-error" class="error" hidden></p>' +
      '<div class="actions"><button data-action="start" class="primary big">Turnier starten</button>' +
      '<button data-action="import" class="secondary">Turnier importieren</button></div>' +
      '</section>';
  }

  function startTournament() {
    var err = document.getElementById('setup-error');
    var teams = draft.teams.map(function (t, i) {
      return { name: t.name.trim() || 'Team ' + (i + 1),
        players: t.players.map(function (p, j) { return p.trim() || 'Spieler ' + (i + 1) + (j ? 'b' : 'a'); }) };
    });
    var names = teams.map(function (t) { return t.name.toLowerCase(); });
    var dup = names.find(function (x, i) { return names.indexOf(x) !== i; });
    if (dup) { err.textContent = 'Teamnamen müssen eindeutig sein („' + dup + '“).'; err.hidden = false; return; }
    var mode = F.getMode(teams.length);
    state = F.createTournament({ name: draft.name.trim() || 'Flankiball-Turnier', date: draft.date,
      thirdPlace: draft.thirdPlace != null ? draft.thirdPlace : mode.thirdPlace, teams: teams });
    draft = null;
    Store.save(state);
    go('#/');
  }

  /* ---------- 6.2 Dashboard ---------- */
  function viewDashboard() {
    var t = state.tournament, open = openMatches(), pod = F.podium(state);
    var html = '<section class="card hero"><div><h1>' + esc(t.name) + '</h1>' +
      '<p class="muted">' + esc(t.date) + ' · ' + t.teamCount + ' Teams · ' + esc(F.describeMode(t.teamCount)) + '</p></div>' +
      '<div class="phase">' + esc(F.phaseLabel(state)) + '</div>';
    if (open.length) html += '<button data-action="next-match" class="primary big">' +
      (open[0].status === 'in_progress' ? 'Laufendes Spiel fortsetzen' : 'Nächstes Spiel starten') + '</button>';
    html += '</section>';

    if (pod.length) {
      html += '<section class="card podium"><h2>🏆 Siegerehrung</h2><ol>' + pod.map(function (p) {
        return '<li class="place' + p.place + '"><span>' + p.place + '.</span> ' + tname(p.teamId) + '</li>';
      }).join('') + '</ol></section>';
    }
    if (open.length) {
      html += '<section class="card"><h2>Nächste Spiele</h2><div class="match-list">' +
        open.slice(0, 5).map(matchRow).join('') + '</div></section>';
    }
    if (t.groups.length) {
      html += '<section class="card"><h2>Gruppenstand</h2><div class="groups-grid">' +
        t.groups.map(function (g) { return '<div><h3>' + esc(g.name) + '</h3>' + standingsTable(g, true) + '</div>'; }).join('') +
        '</div></section>';
    }
    if (F.mainStages(state).length || t.config.series) {
      html += '<section class="card"><h2>' + (t.config.series ? 'Serie' : 'K.o.-Baum') + '</h2>' + bracket() + '</section>';
    }
    return html;
  }

  /* ---------- 6.3 Gruppen ---------- */
  function standingsTable(g, compact) {
    var rows = F.groupStandings(state, g);
    var t = state.tournament, perGroup = Math.floor(t.config.qualifiers / t.groups.length);
    return '<table class="standings"><thead><tr><th>#</th><th>Team</th><th title="Spiele">Sp</th><th>S</th><th>N</th>' +
      (compact ? '' : '<th>Treffer</th><th>Würfe</th>') + '<th>Quote</th><th>Pkt</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="' + (r.rank <= perGroup ? 'qualified' : '') + '"><td>' + r.rank + '</td><td>' + tname(r.teamId) +
          '</td><td>' + r.matchesPlayed + '</td><td>' + r.wins + '</td><td>' + r.losses + '</td>' +
          (compact ? '' : '<td>' + r.hitsTotal + '</td><td>' + r.throwsTotal + '</td>') +
          '<td>' + pct(r.hitQuote) + '</td><td><strong>' + r.points + '</strong></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function viewGroups() {
    var groups = state.tournament.groups;
    if (!groups.length) return '<section class="card"><p>Dieses Turnier hat keine Gruppenphase.</p></section>';
    var gi = Math.min(ui.group, groups.length - 1), g = groups[gi];
    var ms = state.matches.filter(function (m) { return m.groupId === g.id; });
    var ll = '';
    if (!F.mainStages(state).length && state.tournament.config.qualifiers % groups.length) {
      ll = '<p class="muted small">Zusätzlich ziehen die besten Gruppen-' +
        (Math.floor(state.tournament.config.qualifiers / groups.length) + 1) + 'ten als Lucky Loser in die K.o.-Runde ein (Punkte pro Spiel, dann Quote).</p>';
    }
    return '<section class="card">' +
      (groups.length > 1 ? '<div class="tabs">' + groups.map(function (x, i) {
        return '<button data-action="tab" data-i="' + i + '" class="' + (i === gi ? 'active' : '') + '">' + esc(x.name) + '</button>';
      }).join('') + '</div>' : '<h1>' + esc(g.name) + '</h1>') +
      standingsTable(g, false) + ll +
      '<p class="muted small">Sortierung: Punkte, Trefferquote, alphabetisch. Bei identischer Quote entscheidet ein Kopfball- oder Konfetti-Match (nicht im System).</p>' +
      '</section><section class="card"><h2>Spiele</h2><div class="match-list">' + ms.map(matchRow).join('') + '</div></section>';
  }

  /* ---------- 6.4 K.o. ---------- */
  function bracketMatch(m) {
    var r = m.result, w = r && r.winnerTeamId;
    function line(id, hits) {
      return '<div class="bteam ' + (w === id ? 'win' : w ? 'lose' : '') + '"><span>' + tname(id) +
        (team(id) && team(id).seed ? ' <small>(' + team(id).seed + ')</small>' : '') + '</span><b>' + (r ? hits : '') + '</b></div>';
    }
    return '<a class="bmatch" href="#/match/' + m.id + '">' + line(m.homeTeamId, r && r.homeTeamHits) +
      line(m.awayTeamId, r && r.awayTeamHits) + (r ? '' : '<div class="bstatus">' + statusBadge(m) + '</div>') + '</a>';
  }

  function bracket() {
    var t = state.tournament;
    if (t.config.series) {
      var st = t.knockoutStages[0], wins = {};
      var ms = F.stageMatches(state, st.id);
      ms.forEach(function (m) { if (m.result) wins[m.result.winnerTeamId] = (wins[m.result.winnerTeamId] || 0) + 1; });
      return '<div class="series-score">' + state.teams.map(function (x) {
        return '<div><span>' + esc(x.name) + '</span><b>' + (wins[x.id] || 0) + '</b></div>';
      }).join('') + '</div><div class="match-list">' + ms.map(matchRow).join('') + '</div>';
    }
    var stages = F.mainStages(state);
    if (!stages.length) return '<p class="muted">Die K.o.-Runde wird automatisch erstellt, sobald alle Gruppenspiele beendet sind.</p>';
    // Noch nicht erzeugte Runden als Platzhalter zeigen
    var cols = stages.map(function (s) { return { name: s.stageName, matches: F.stageMatches(state, s.id) }; });
    for (var size = stages[stages.length - 1].size / 2; size >= 2; size /= 2) {
      cols.push({ name: size === 2 ? 'Finale' : size === 4 ? 'Halbfinale' : 'Viertelfinale', placeholder: size / 2 });
    }
    var third = t.knockoutStages.find(function (s) { return s.kind === 'third'; });
    return '<div class="bracket">' + cols.map(function (c) {
      var body = c.matches ? c.matches.map(bracketMatch).join('')
        : new Array(c.placeholder + 1).join('<div class="bmatch placeholder"><div class="bteam">offen</div><div class="bteam">offen</div></div>');
      return '<div class="bcol"><h3>' + esc(c.name) + '</h3><div class="bcol-body">' + body + '</div></div>';
    }).join('') + '</div>' +
      (third ? '<h3>Spiel um Platz 3</h3><div class="bthird">' + F.stageMatches(state, third.id).map(bracketMatch).join('') + '</div>' : '');
  }

  function viewKo() {
    var t = state.tournament, html = '<section class="card"><h1>' + (t.config.series ? 'Serie' : 'K.o.-Phase') + '</h1>' + bracket() + '</section>';
    if (!t.config.series && F.mainStages(state).length) {
      var q = state.teams.filter(function (x) { return x.seed; }).sort(function (a, b) { return a.seed - b.seed; });
      html += '<section class="card"><h2>Setzliste</h2><ol class="seeds">' + q.map(function (x) {
        return '<li>' + esc(x.name) + '</li>';
      }).join('') + '</ol></section>';
    }
    return html;
  }

  /* ---------- 3. Match ---------- */
  function viewMatch(id) {
    var m = F.matchById(state, id);
    if (!m) return '<section class="card"><p>Spiel nicht gefunden.</p><a href="#/">Zur Übersicht</a></section>';
    var home = team(m.homeTeamId), away = team(m.awayTeamId), sa = m.sideAssignment;
    var head = '<section class="card match-head"><div class="ctx">' + esc(matchContext(m)) + ' ' + statusBadge(m) + '</div>' +
      '<h1>' + esc(home.name) + ' <span class="vs">vs</span> ' + esc(away.name) + '</h1>' +
      '<div class="sides"><span class="side side-a">' + sideLabel('side_a') + ': ' +
      esc(sa.homeTeamSide === 'side_a' ? home.name : away.name) + '</span><span class="side side-b">' + sideLabel('side_b') + ': ' +
      esc(sa.homeTeamSide === 'side_b' ? home.name : away.name) + '</span>' +
      (m.status === 'not_started' ? '<button class="small secondary" data-action="swap-sides" data-id="' + m.id + '">Seiten tauschen</button>' : '') +
      '</div></section>';

    if (m.status === 'not_started') return head + matchSetup(m);
    if (m.status === 'in_progress') return head + matchLive(m);
    return head + matchSummary(m);
  }

  function matchSetup(m) {
    if (!m.playerOrder) {
      m.playerOrder = {};
      m.playerOrder[m.homeTeamId] = team(m.homeTeamId).players.slice();
      m.playerOrder[m.awayTeamId] = team(m.awayTeamId).players.slice();
      m.startingTeamId = m.homeTeamId;
    }
    function orderBox(tid) {
      return '<div class="order-box"><h3>' + tname(tid) + '</h3><ol>' + m.playerOrder[tid].map(function (pid) {
        return '<li>' + pname(pid) + '</li>';
      }).join('') + '</ol><button class="secondary small" data-action="swap-order" data-id="' + m.id + '" data-team="' + tid + '">Reihenfolge tauschen</button></div>';
    }
    return '<section class="card"><h2>Spieler-Reihenfolge</h2><div class="grid2">' +
      orderBox(m.homeTeamId) + orderBox(m.awayTeamId) + '</div>' +
      '<h2>Wer wirft zuerst?</h2><div class="segmented">' + [m.homeTeamId, m.awayTeamId].map(function (tid) {
        return '<button data-action="starting" data-id="' + m.id + '" data-team="' + tid + '" class="' +
          (m.startingTeamId === tid ? 'active' : '') + '">' + tname(tid) + '</button>';
      }).join('') + '</div>' +
      '<div class="actions"><button class="primary big" data-action="begin" data-id="' + m.id + '">Spiel starten</button></div></section>';
  }

  function matchLive(m) {
    var tot = F.matchTotals(m), auto = state.tournament.settings.autoSwitch;
    var next = F.nextThrower(m);
    var sel = auto ? next : (ui.selectedThrower && ui.selectedThrower.matchId === m.id ? ui.selectedThrower : next);
    function teamPanel(tid) {
      var x = tot[tid], active = sel && sel.teamId === tid;
      return '<div class="team-panel ' + (active ? 'active' : '') + '"><h3>' + tname(tid) + '</h3>' +
        '<div class="counters"><div><b>' + x.throws + '</b><span>Würfe</span></div><div><b>' + x.hits + '</b><span>Treffer</span></div>' +
        '<div><b>' + pct(F.quote(x.hits, x.throws)) + '</b><span>Quote</span></div></div>' +
        '<div class="players">' + m.playerOrder[tid].map(function (pid) {
          var isSel = sel && sel.playerId === pid;
          return auto ? '<span class="player ' + (isSel ? 'current' : '') + '">' + pname(pid) + warnBadge(m, pid) + banBadge(m, pid) + '</span>'
            : '<button class="player ' + (isSel ? 'current' : '') + '" data-action="pick" data-id="' + m.id + '" data-team="' + tid + '" data-player="' + pid + '">' + pname(pid) + warnBadge(m, pid) + banBadge(m, pid) + '</button>';
        }).join('') + '</div></div>';
    }
    var last = m.throwSequence.slice(-6).reverse();
    return '<section class="card live"><div class="grid2 panels">' + teamPanel(m.homeTeamId) + teamPanel(m.awayTeamId) + '</div>' +
      '<div class="throw-box"><div class="next-label">Nächster Wurf: <strong>' + (sel ? tname(sel.teamId) + ' – ' + pname(sel.playerId) : '–') + '</strong></div>' +
      '<div class="throw-buttons"><button class="hit" data-action="throw" data-hit="1" data-id="' + m.id + '">✓ Treffer</button>' +
      '<button class="miss" data-action="throw" data-hit="0" data-id="' + m.id + '">✗ Daneben</button></div>' +
      '<div class="throw-tools"><label class="toggle"><input type="checkbox" data-action="auto-switch"' + (auto ? ' checked' : '') + '> Wechsel automatisch</label>' +
      '<button class="secondary small" data-action="undo" data-id="' + m.id + '"' + (m.throwSequence.length || (m.penalties || []).length ? '' : ' disabled') + '>↶ Letzte Eingabe zurücknehmen</button></div>' +
      (last.length ? '<ul class="throw-log">' + last.map(function (e) {
        return '<li><span>#' + e.throwNumber + '</span> ' + pname(e.playerId) + ' <b class="' + (e.isHit ? 'hit' : 'miss') + '">' + (e.isHit ? 'Treffer' : 'daneben') + '</b></li>';
      }).join('') + '</ul>' : '') + '</div>' + penaltyBox(m) +
      '<div class="end-box"><h2>Spiel beenden – Bier leer bei:</h2><div class="segmented">' + [m.homeTeamId, m.awayTeamId].map(function (tid) {
        return '<button class="primary" data-action="finish" data-id="' + m.id + '" data-team="' + tid + '">' + tname(tid) + ' gewinnt</button>';
      }).join('') + '</div></div></section>';
  }

  function matchSummary(m) {
    var r = m.result, stats = F.playerStats(state);
    function playerLine(pid) {
      var s = stats.find(function (x) { return x.playerId === pid; });
      var th = s.throwsByMatch[m.id] || 0, h = s.hitsByMatch[m.id] || 0;
      return '<tr><td>' + pname(pid) + warnBadge(m, pid) + '</td><td>' + th + '</td><td>' + h + '</td><td>' + pct(F.quote(h, th)) + '</td></tr>';
    }
    function block(tid, hits, throws, q) {
      return '<div class="team-panel ' + (r.winnerTeamId === tid ? 'winner' : '') + '"><h3>' + tname(tid) + (r.winnerTeamId === tid ? ' 🏆' : '') + '</h3>' +
        '<div class="counters"><div><b>' + throws + '</b><span>Würfe</span></div><div><b>' + hits + '</b><span>Treffer</span></div><div><b>' + pct(q) + '</b><span>Quote</span></div></div>' +
        '<table><thead><tr><th>Spieler</th><th>W</th><th>T</th><th>Quote</th></tr></thead><tbody>' +
        team(tid).players.map(playerLine).join('') + '</tbody></table></div>';
    }
    return '<section class="card"><div class="grid2 panels">' + block(m.homeTeamId, r.homeTeamHits, r.homeTeamThrows, r.homeTeamQuote) +
      block(m.awayTeamId, r.awayTeamHits, r.awayTeamThrows, r.awayTeamQuote) + '</div>' +
      '<h2>Verwarnungen &amp; Strafen</h2>' + penaltyList(m, false) +
      '<div class="actions"><button class="secondary" data-action="next-match">Nächstes Spiel</button>' +
      (F.canReopen(state, m) ? '<button class="secondary" data-action="reopen" data-id="' + m.id + '">Ergebnis korrigieren</button>' : '') +
      '</div></section>';
  }

  /* ---------- 6.5 Statistik ---------- */
  function viewStats() {
    var ts = F.teamStats(state), ps = F.playerRanking(state, ui.minThrows);
    return '<section class="card"><h1>Team-Statistik</h1><div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>N</th><th>Treffer</th><th>Würfe</th><th>Quote</th><th>Pkt</th>' + penHead() + '</tr></thead><tbody>' +
      ts.map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + tname(r.teamId) + '</td><td>' + r.matchesPlayed + '</td><td>' + r.wins + '</td><td>' + r.losses +
          '</td><td>' + r.hitsTotal + '</td><td>' + r.throwsTotal + '</td><td>' + pct(r.hitQuote) + '</td><td><strong>' + r.points + '</strong></td>' + penCells(r.penalties) + '</tr>';
      }).join('') + '</tbody></table></div><p class="muted small">Team-Werte enthalten auch die Strafen der einzelnen Spieler.</p></section>' +
      '<section class="card"><h1>Spieler-Rangliste</h1><label class="inline">Mindestwürfe <input type="number" min="0" max="99" data-bind="minThrows" value="' + ui.minThrows + '"></label>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>Spieler</th><th>Team</th><th>Würfe</th><th>Treffer</th><th>Quote</th><th>Sp</th><th>S</th>' + penHead(true) + '</tr></thead><tbody>' +
      ps.map(function (s, i) {
        var ok = s.throwsTotal >= ui.minThrows;
        return '<tr class="' + (ok ? '' : 'dim') + '"><td>' + (ok ? i + 1 : '–') + '</td><td>' + esc(s.name) + '</td><td>' + tname(s.teamId) +
          '</td><td>' + s.throwsTotal + '</td><td>' + s.hitsTotal + '</td><td>' + pct(s.hitQuote) + '</td><td>' + s.matchesPlayed + '</td><td>' + s.wins + '</td>' + penCells(s.penalties, true) + '</tr>';
      }).join('') + '</tbody></table></div><p class="muted small">Sortiert nach Quote (nur Spieler mit genug Würfen), dann Treffern.</p></section>';
  }

  function penKeys(noTeamSkip) {
    return Object.keys(F.PENALTY_TYPES).filter(function (k) { return !(noTeamSkip && k === 'skip_team'); });
  }
  function penHead(noTeamSkip) {
    return penKeys(noTeamSkip).map(function (k) { return '<th title="' + F.PENALTY_TYPES[k] + '">' + PEN_ICONS[k] + '</th>'; }).join('');
  }
  function penCells(c, noTeamSkip) {
    return penKeys(noTeamSkip).map(function (k) { return '<td>' + (c[k] || '') + '</td>'; }).join('');
  }

  function exportPlayersCsv() {
    var rows = [['Spieler', 'Team', 'Würfe', 'Treffer', 'Quote', 'Spiele', 'Siege', 'Niederlagen', 'Verwarnungen', 'Aussetzen', 'Strafhalben']];
    F.playerRanking(state, ui.minThrows).forEach(function (s) {
      rows.push([s.name, team(s.teamId).name, s.throwsTotal, s.hitsTotal, (s.hitQuote * 100).toFixed(1).replace('.', ','), s.matchesPlayed, s.wins, s.losses, s.penalties.warning, s.penalties.skip_player, s.penalties.strafhalbe]);
    });
    var csv = '﻿' + rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'flankenscore_spieler.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  /* ---------- Router ---------- */
  function render() {
    var route = location.hash.replace(/^#\/?/, '');
    if (!state && route !== 'setup') route = 'setup';
    var html;
    if (route === 'setup') html = viewSetup();
    else if (route === 'groups') html = viewGroups();
    else if (route === 'ko') html = viewKo();
    else if (route === 'stats') html = viewStats();
    else if (route.indexOf('match/') === 0) html = viewMatch(route.slice(6));
    else { route = ''; html = viewDashboard(); }
    renderNav(route.split('/')[0]);
    app.innerHTML = html;
    document.body.classList.toggle('in-match', route.indexOf('match/') === 0);
  }

  /* ---------- Aktionen ---------- */
  var actions = {
    'add-team': function () { draft.teams.push({ name: '', players: ['', ''] }); render(); },
    'remove-team': function (d) { draft.teams.splice(+d.i, 1); draft.thirdPlace = null; render(); },
    'start': startTournament,
    'tab': function (d) { ui.group = +d.i; render(); },
    'next-match': function () {
      var open = openMatches();
      go(open.length ? '#/match/' + open[0].id : '#/');
    },
    'swap-sides': function (d) {
      var m = F.matchById(state, d.id), s = m.sideAssignment;
      m.sideAssignment = { homeTeamSide: s.awayTeamSide, awayTeamSide: s.homeTeamSide };
      Store.save(state); render();
    },
    'swap-order': function (d) { F.matchById(state, d.id).playerOrder[d.team].reverse(); render(); },
    'starting': function (d) { F.matchById(state, d.id).startingTeamId = d.team; render(); },
    'begin': function (d) {
      var m = F.matchById(state, d.id);
      m.status = 'in_progress'; m.updatedAt = F.now();
      ui.selectedThrower = null;
      Store.save(state); render();
    },
    'pick': function (d) { ui.selectedThrower = { matchId: d.id, teamId: d.team, playerId: d.player }; render(); },
    'throw': function (d) {
      var m = F.matchById(state, d.id), auto = state.tournament.settings.autoSwitch;
      var sel = !auto && ui.selectedThrower && ui.selectedThrower.matchId === m.id ? ui.selectedThrower : F.nextThrower(m);
      F.recordThrow(m, sel.playerId, sel.teamId, d.hit === '1');
      ui.selectedThrower = null;
      Store.save(state); render();
    },
    'undo': function (d) {
      var m = F.matchById(state, d.id);
      F.undoLast(m);
      ui.selectedThrower = null;
      Store.save(state); render();
    },
    'pen-type': function (d) { ui.penType = d.type && d.type !== ui.penType ? d.type : null; render(); },
    'pen-add': function (d) {
      F.addPenalty(F.matchById(state, d.id), ui.penType, d.team, d.player);
      ui.penType = null; ui.selectedThrower = null;
      Store.save(state); render();
    },
    'pen-del': function (d) {
      if (!confirm('Eintrag löschen?')) return;
      F.removePenalty(F.matchById(state, d.id), d.pen);
      Store.save(state); render();
    },
    'finish': function (d) {
      var m = F.matchById(state, d.id);
      if (!confirm(team(d.team).name + ' gewinnt das Spiel?')) return;
      m.result = F.buildResult(m, d.team);
      m.status = 'completed'; m.updatedAt = F.now();
      commit();
    },
    'reopen': function (d) {
      if (!confirm('Ergebnis zurücksetzen und Spiel wieder öffnen? Die Würfe bleiben erhalten, noch nicht begonnene Folgespiele werden neu ausgelost.')) return;
      var m = F.matchById(state, d.id);
      F.reopen(state, m);
      Store.save(state); render();
    },
    'export': function () { Store.exportJson(state); },
    'import': function () { document.getElementById('importFile').click(); },
    'print': function () { window.print(); },
    'export-players': exportPlayersCsv,
    'new': function () {
      if (!confirm('Neues Turnier anlegen? Das aktuelle Turnier wird gelöscht – vorher ggf. exportieren.')) return;
      state = null; draft = newDraft(); Store.save(null); go('#/setup');
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'INPUT') return;
    var fn = actions[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    var menu = el.closest('details.menu');
    if (menu) menu.open = false;
    fn(el.dataset);
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.action === 'auto-switch') {
      state.tournament.settings.autoSwitch = el.checked;
      ui.selectedThrower = null;
      Store.save(state); render();
    } else if (el.dataset.bind === 'thirdPlace') {
      draft.thirdPlace = el.checked;
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target, b = el.dataset.bind;
    if (!b) return;
    if (b === 'minThrows') { ui.minThrows = Math.max(0, +el.value || 0); var pos = el.selectionStart; render(); var n = app.querySelector('[data-bind=minThrows]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* number input */ } return; }
    if (!draft) return;
    if (b === 'name') draft.name = el.value;
    else if (b === 'date') draft.date = el.value;
    else if (b === 'team') draft.teams[+el.dataset.i].name = el.value;
    else if (b === 'player') draft.teams[+el.dataset.i].players[+el.dataset.p] = el.value;
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (state && !confirm('Das aktuelle Turnier wird durch die Datei ersetzt. Fortfahren?')) return;
    Store.importJson(file).then(function (data) {
      state = data; draft = null; Store.save(state); go('#/');
    }).catch(function (err) { alert('Import fehlgeschlagen: ' + err.message); });
  });

  // Tastatur-Kürzel im Spiel: T = Treffer, D/Leertaste = daneben, Z = zurück
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('in-match') || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var map = { t: '[data-action=throw][data-hit="1"]', d: '[data-action=throw][data-hit="0"]', z: '[data-action=undo]' };
    var sel = map[e.key.toLowerCase()];
    var btn = sel && app.querySelector(sel);
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
  });

  window.addEventListener('hashchange', render);
  window.addEventListener('storage', function (e) { if (e.key === 'flankenscore_tournament') { state = Store.load(); render(); } });
  render();
})();

</script>
</body>
</html>
