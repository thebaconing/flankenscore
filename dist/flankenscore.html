  <style>
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --text: #1c2420;
  --muted: #637068;
  --border: #dde3de;
  --primary: #1f7a4d;
  --primary-text: #ffffff;
  --accent: #f2b233;
  --hit: #1f9d55;
  --miss: #d64545;
  --side-a: #2c6fbb;
  --side-b: #c0612b;
  --highlight: #e7f4ec;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111613;
    --surface: #1a211d;
    --text: #e6ece8;
    --muted: #93a198;
    --border: #2d3831;
    --primary: #2f9e66;
    --highlight: #1f3328;
    --side-a: #5b9be0;
    --side-b: #e08a55;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}
a { color: var(--primary); }
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
h2 { font-size: 1.15rem; margin: 1.25rem 0 .6rem; }
h2:first-child { margin-top: 0; }
h3 { font-size: 1rem; margin: 0 0 .5rem; }
small, .muted { color: var(--muted); }
.small { font-size: .85rem; }
.error { color: var(--miss); font-weight: 600; }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: .6rem 1rem;
  background: var(--primary); color: var(--primary-text);
}
.brand { font-weight: 800; font-size: 1.25rem; color: inherit; text-decoration: none; letter-spacing: -.02em; }
.brand-text span { color: var(--accent); }
#nav { display: flex; align-items: center; gap: .25rem; margin-left: auto; flex-wrap: wrap; }
#nav > a {
  color: inherit; text-decoration: none; padding: .45rem .75rem; border-radius: 8px; font-weight: 500;
}
#nav > a.active, #nav > a:hover { background: rgba(255, 255, 255, .18); }
.menu { position: relative; }
.menu summary {
  list-style: none; cursor: pointer; padding: .3rem .8rem; border-radius: 8px; font-size: 1.3rem; line-height: 1;
}
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary, .menu summary:hover { background: rgba(255, 255, 255, .18); }
.menu > div {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px;
  display: flex; flex-direction: column; padding: .4rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
.menu > div button {
  background: none; border: 0; text-align: left; color: var(--text); padding: .6rem .75rem; border-radius: 8px; min-height: 0;
}
.menu > div button:hover { background: var(--highlight); }
.menu > div button.danger { color: var(--miss); }
.menu-version { display: block; margin-top: .3rem; padding: .5rem .75rem .2rem; border-top: 1px solid var(--border); font-size: .8rem; }

/* ---------- Layout ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.1rem; margin-bottom: 1rem;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }

/* ---------- Formulare & Buttons ---------- */
label { display: flex; flex-direction: column; gap: .3rem; font-weight: 500; }
label.inline { flex-direction: row; align-items: center; gap: .5rem; margin-bottom: .6rem; }
label.inline input { width: 5rem; }
label.toggle { flex-direction: row; align-items: center; gap: .5rem; cursor: pointer; }
label.toggle input { width: 1.3rem; height: 1.3rem; accent-color: var(--primary); }
input:not([type=checkbox]) {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem; min-height: 44px; width: 100%;
}
input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: .55rem 1rem;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
button.secondary { background: var(--bg); }
button.small { min-height: 36px; padding: .35rem .75rem; font-size: .9rem; }
button.big { font-size: 1.1rem; padding: .8rem 1.4rem; }
button.icon { position: absolute; top: .4rem; right: .4rem; min-height: 32px; width: 32px; padding: 0; border: 0; background: none; color: var(--muted); }

.team-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; margin-bottom: .8rem; }
.team-input {
  position: relative; display: flex; flex-direction: column; gap: .4rem;
  border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem; margin: 0;
}
.team-input legend { font-weight: 700; padding: 0 .3rem; }
.mode-info { margin: 1rem 0 .6rem; padding: .7rem .9rem; background: var(--highlight); border-radius: 8px; }

.tabs, .segmented { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs button.active, .segmented button.active { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.segmented button { flex: 1; }

/* ---------- Dashboard ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; justify-content: space-between; }
.hero p { margin: 0; }
.phase { font-weight: 700; color: var(--primary); font-size: 1.1rem; }
.podium ol { list-style: none; padding: 0; margin: 0; display: flex; gap: .8rem; flex-wrap: wrap; }
.podium li { padding: .7rem 1rem; border-radius: 10px; background: var(--highlight); font-weight: 700; }
.podium li span { color: var(--muted); }
.podium .place1 { background: var(--accent); color: #2b1d00; font-size: 1.2rem; }
.podium .place1 span { color: inherit; }
.groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }

/* ---------- Tabellen ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: .45rem .5rem; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; white-space: normal; }
.team-panel table th:first-child, .team-panel table td:first-child { text-align: left; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
tr.qualified td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
tr.dim { opacity: .5; }

/* ---------- Spiellisten ---------- */
.match-list { display: flex; flex-direction: column; gap: .4rem; }
.match-row {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ctx score" "teams score";
  gap: .1rem .8rem; align-items: center; padding: .6rem .8rem;
  border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: inherit;
}
.match-row:hover { background: var(--highlight); }
.match-row .ctx { grid-area: ctx; font-size: .8rem; color: var(--muted); }
.match-row .teams { grid-area: teams; display: flex; gap: .5rem; flex-wrap: wrap; font-weight: 600; }
.match-row .score, .match-row .badge { grid-area: score; }
.score { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.vs { color: var(--muted); font-weight: 400; }
.win { color: var(--primary); }
.badge { font-size: .75rem; font-weight: 700; padding: .2rem .5rem; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.badge.live { background: var(--accent); color: #2b1d00; border-color: var(--accent); }
.badge.done { background: var(--highlight); color: var(--primary); }

/* ---------- K.o.-Baum ---------- */
.bracket { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: .5rem; }
.bcol { flex: 1 0 200px; display: flex; flex-direction: column; }
.bcol-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: .8rem; }
.bmatch {
  display: block; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  text-decoration: none; color: inherit; background: var(--surface);
}
.bmatch:hover { border-color: var(--primary); }
.bmatch.placeholder { opacity: .5; }
.bteam { display: flex; justify-content: space-between; gap: .5rem; padding: .45rem .7rem; }
.bteam + .bteam { border-top: 1px solid var(--border); }
.bteam.win { font-weight: 700; background: var(--highlight); }
.bteam.lose { color: var(--muted); }
.bstatus { padding: .3rem .7rem; border-top: 1px solid var(--border); }
.bthird { max-width: 260px; }
.series-score { display: flex; gap: 1rem; margin-bottom: 1rem; }
.series-score div { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: .8rem 1rem; background: var(--highlight); border-radius: 10px; font-weight: 700; }
.series-score b { font-size: 1.8rem; }
.seeds { columns: 2; margin: 0; }

/* ---------- Match ---------- */
.match-head h1 { margin: .3rem 0 .6rem; }
.match-head .ctx { color: var(--muted); font-size: .9rem; display: flex; gap: .5rem; align-items: center; }
.sides { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.side { padding: .3rem .7rem; border-radius: 99px; font-weight: 600; font-size: .9rem; color: #fff; }
.side-a { background: var(--side-a); }
.side-b { background: var(--side-b); }
.order-box { border: 1px solid var(--border); border-radius: 10px; padding: .8rem; }
.order-box ol { margin: 0 0 .6rem; padding-left: 1.3rem; font-weight: 600; }

.team-panel { border: 2px solid var(--border); border-radius: var(--radius); padding: .8rem; transition: border-color .15s, background .15s; }
.team-panel.active { border-color: var(--primary); background: var(--highlight); }
.team-panel.winner { border-color: var(--accent); }
.counters { display: flex; gap: .5rem; margin-bottom: .6rem; }
.counters div { flex: 1; text-align: center; background: var(--bg); border-radius: 8px; padding: .4rem; }
.counters b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.counters span { font-size: .75rem; color: var(--muted); }
.players { display: flex; gap: .4rem; flex-wrap: wrap; }
.player { padding: .35rem .7rem; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; }
.player.current { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

.throw-box { margin-top: 1rem; }
.next-label { font-size: 1.1rem; margin-bottom: .6rem; text-align: center; }
.throw-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.throw-buttons button { min-height: 88px; font-size: 1.4rem; border: 0; color: #fff; }
.throw-buttons .hit { background: var(--hit); }
.throw-buttons .miss { background: var(--miss); }
.throw-buttons button:active { transform: scale(.98); }
.throw-tools { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
.throw-log { list-style: none; padding: 0; margin: .8rem 0 0; display: flex; gap: .4rem; flex-wrap: wrap; font-size: .85rem; }
.throw-log li { background: var(--bg); border-radius: 99px; padding: .2rem .6rem; }
.throw-log li span { color: var(--muted); }
b.hit { color: var(--hit); }
b.miss { color: var(--miss); }
.end-box { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
.end-box .segmented { margin-bottom: 0; }
.end-box .abort { margin-top: 1rem; color: var(--miss); }

/* Landscape-Modus für Match-Tracking (7.4) */
@media (orientation: landscape) and (max-height: 560px) {
  body.in-match .topbar { position: static; }
  body.in-match .match-head { padding: .6rem 1rem; }
  body.in-match .match-head h1 { font-size: 1.2rem; margin: .1rem 0 .3rem; }
  body.in-match .live .panels { grid-template-columns: 1fr 1fr; gap: .6rem; }
  body.in-match .counters b { font-size: 1.2rem; }
  body.in-match .throw-buttons button { min-height: 64px; }
}

@media (max-width: 600px) {
  main { padding: .6rem; }
  .card { padding: .9rem; }
  .topbar { padding: .5rem .6rem; }
  #nav { margin-left: 0; width: 100%; }
  #nav > a { padding: .4rem .55rem; font-size: .95rem; }
  .menu { margin-left: auto; }
  .seeds { columns: 1; }
}

/* ---------- Druck (6.6) ---------- */
@media print {
  :root { --bg: #fff; --surface: #fff; --text: #000; --highlight: #eee; }
  .no-print, .actions, button, .throw-box, .end-box, .tabs { display: none !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .card { border: 0; padding: 0 0 1rem; break-inside: avoid; }
  .bracket { overflow: visible; flex-wrap: wrap; }
  a { color: inherit; text-decoration: none; }
}

/* ---------- Verwarnungen & Strafen ---------- */
.penalty-box { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
.pen-types button { flex: 1 1 45%; font-size: .95rem; }
.pen-targets { padding: .8rem; margin-bottom: .8rem; border-radius: 10px; background: var(--highlight); }
.pen-targets p { margin: 0 0 .5rem; }
.pen-targets .grid2 { margin-bottom: .6rem; }
.penalty-list { list-style: none; padding: 0; margin: .4rem 0 0; display: flex; flex-direction: column; gap: .3rem; }
.penalty-list li { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .35rem .6rem; border-radius: 8px; background: var(--bg); border-left: 4px solid var(--accent); }
.penalty-list li.pen-skip_player, .penalty-list li.pen-skip_team { border-left-color: var(--side-a); }
.penalty-list li.pen-strafhalbe { border-left-color: var(--miss); }
.penalty-list small { color: var(--muted); }
.pen-icon { width: 1.8rem; text-align: center; }
button.icon-inline { margin-left: auto; min-height: 32px; width: 32px; padding: 0; border: 0; background: none; color: var(--muted); }
.warn-badge { color: #b27800; font-size: .85em; margin-left: .2rem; }
.player.current .warn-badge { color: var(--accent); }
@media print { .penalty-box { display: none; } }

.ban-state { font-size: .85rem; font-weight: 600; }
.ban-state.open { color: var(--miss); }
.ban-state.done { color: var(--muted); font-weight: 400; }
.ban-badge { margin-left: .2rem; font-size: .85em; }

/* ---------- Logo ---------- */
.brand { display: inline-flex; align-items: center; gap: .5rem; }
.brand-logo { height: 38px; width: auto; padding: 2px 4px; border-radius: 8px; background: #f3f5f2; }
@media (max-width: 600px) { .brand-logo { height: 32px !important; } }

/* ---------- Wurf-Tabelle ---------- */
.team-panel .order-swap { margin-top: .6rem; }
.throw-table td, .throw-table th { text-align: left; vertical-align: middle; }
.throw-table td:first-child, .throw-table th:first-child { text-align: right; width: 2.5rem; color: var(--muted); }
.throw-table select {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: .35rem .5rem; min-height: 36px; max-width: 12rem;
}
.result-toggle { min-width: 7.5rem; border: 0; color: #fff; }
.result-toggle.hit { background: var(--hit); }
.result-toggle.miss { background: var(--miss); }
.throw-table button.icon-inline { margin-left: 0; }
@media print { .throw-table select { border: 0; appearance: none; } }

/* Strafen-Buttons pro Team und Spieler */
.pen-team { border: 1px solid var(--border); border-radius: 10px; padding: .7rem; }
.pen-team h3 { margin-bottom: .6rem; }
.pen-row { display: grid; grid-template-columns: minmax(4.5rem, 1fr) auto auto; gap: .4rem; align-items: center; margin-top: .4rem; }
.pen-who { font-weight: 600; overflow-wrap: anywhere; }
.pen-btn { min-height: 40px; padding: .3rem .6rem; font-size: .88rem; white-space: nowrap; background: var(--bg); }
.pen-btn.pen-warning { border-color: var(--accent); }
.pen-btn.pen-skip_team, .pen-btn.pen-skip_player { border-color: var(--side-a); }
.pen-btn.pen-strafhalbe { border-color: var(--miss); }
.pen-teams { margin-bottom: .8rem; }
/* Schmale Handys (hochkant): Name oben, Buttons rechtsbündig darunter, ohne über den Rand zu ragen */
@media (max-width: 380px) {
  .pen-row { display: flex; flex-wrap: wrap; justify-content: flex-end; }
  .pen-who { flex: 1 0 100%; }
  .pen-btn { flex: 0 1 auto; min-width: 0; padding: .3rem .5rem; }
}
.throw-table td.team-short { max-width: 6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 600px) {
  .throw-table th, .throw-table td { padding: .35rem .3rem; }
  .throw-table select { max-width: 8.5rem; }
  .result-toggle { min-width: 0; padding: .3rem .55rem; }
}

/* Turnier-Verlauf */
button.danger { color: var(--miss); }
.history-list { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .5rem; }
.history-item { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 10px; }
.history-item.active { border-color: var(--primary); }
.history-info { flex: 1 1 14rem; min-width: 0; }
.history-info .small { display: block; margin-top: .15rem; }
.history-actions { display: flex; gap: .4rem; flex-wrap: wrap; }

/* Android-App (Capacitor): Platz für Status- und Navigationsleiste */
.topbar { padding-top: calc(.6rem + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))); }
body { padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); }
@media (max-width: 600px) {
  .topbar { padding-top: calc(.5rem + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))); }
}
@media print { .topbar, body { padding-top: 0; padding-bottom: 0; } }

/* ---------- Überlauf-Schutz (lange Namen, schmale Bildschirme) ---------- */
body { overflow-x: clip; } /* clip statt hidden: erhält position: sticky der Kopfzeile */
main, .card, .team-panel, .team-input, .pen-team, .order-box, .pen-targets, .history-item { min-width: 0; max-width: 100%; }
/* Flex-/Grid-Kinder dürfen schrumpfen statt den Container zu sprengen */
.grid2 > *, .groups-grid > *, .team-inputs > *, .hero > *, .match-row > *, .series-score > *,
.counters > *, .bteam > *, .actions > *, .tabs > *, .segmented > *, .throw-tools > *, .sides > * { min-width: 0; }
/* Spaltenminima nie breiter als der verfügbare Platz */
.grid2 { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.groups-grid { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.team-inputs { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
.match-row { grid-template-columns: minmax(0, 1fr) auto; }
.menu > div { max-width: calc(100vw - 1.5rem); }
/* Lange Wörter/Namen umbrechen */
h1, h2, h3, p, li, label, legend, .brand-text, .phase, .match-row .teams, .bteam, .side, .player,
.podium li, .series-score div, .next-label, .history-info, .penalty-list li, .mode-info { overflow-wrap: anywhere; }
button { max-width: 100%; overflow-wrap: anywhere; }
.bteam > :first-child { overflow: hidden; text-overflow: ellipsis; }
.series-score { flex-wrap: wrap; }
.series-score div { flex: 1 1 10rem; gap: .5rem; }
.counters b { overflow: hidden; text-overflow: ellipsis; }
img, svg, video, iframe, select, input, textarea { max-width: 100%; }
td, th { overflow-wrap: normal; }
td:nth-child(2) { overflow-wrap: anywhere; min-width: 5rem; }
.table-wrap { max-width: 100%; -webkit-overflow-scrolling: touch; }
@media (max-width: 380px) {
  .throw-buttons { gap: .5rem; }
  .throw-buttons button { font-size: 1.15rem; }
}

/* Regelwerk-Overlay (über der App, Spielstand bleibt erhalten) */
.rules-overlay { position: fixed; inset: 0; z-index: 1000; background: var(--bg, #f3f5f2); }
.rules-overlay[hidden] { display: none; }
.rules-overlay iframe { width: 100%; height: 100%; border: 0; display: block; }
body.rules-open { overflow: hidden; }
@media print { .rules-overlay { display: none !important; } }

</style>
</head>

  <script>

  <script>
/* Flankenscore – reine Turnierlogik (keine DOM-Zugriffe) */
(function (global) {
  'use strict';

  function uuid() {
    if (global.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }
  function now() { return new Date().toISOString(); }

  /* ---------- 1.1 Modi nach Teamanzahl ----------
   * groups: Gruppengrößen, legs: 1 = Hinrunde, 2 = Hin- & Rückrunde
   * qualifiers: Teams in der K.o.-Phase, thirdPlace: Standard für Spiel um Platz 3
   * series: Best-of-N (nur bei 2 Teams)
   */
  var MODES = {
    2:  { groups: [2], series: 5 },
    3:  { groups: [3], legs: 2, qualifiers: 2, thirdPlace: false },
    4:  { groups: [4], legs: 2, qualifiers: 2, thirdPlace: true },
    5:  { groups: [5], legs: 1, qualifiers: 4, thirdPlace: true },
    6:  { groups: [3, 3], legs: 2, qualifiers: 4, thirdPlace: true },
    7:  { groups: [7], legs: 1, qualifiers: 4, thirdPlace: true },
    8:  { groups: [4, 4], legs: 1, qualifiers: 4, thirdPlace: false },
    9:  { groups: [3, 3, 3], legs: 1, qualifiers: 8, thirdPlace: true },
    10: { groups: [5, 5], legs: 1, qualifiers: 4, thirdPlace: false },
    11: { groups: [4, 4, 3], legs: 1, qualifiers: 8, thirdPlace: true },
    12: { groups: [4, 4, 4], legs: 1, qualifiers: 8, thirdPlace: false }
  };
  var MIN_TEAMS = 2, MAX_TEAMS = 12;
  var STAGE_NAMES = { 8: 'Viertelfinale', 4: 'Halbfinale', 2: 'Finale' };

  function getMode(teamCount) { return MODES[teamCount] || null; }

  function describeMode(teamCount) {
    var m = getMode(teamCount);
    if (!m) return 'Nicht unterstützt (2–12 Teams)';
    if (m.series) return 'Best of ' + m.series;
    var g = m.groups.length === 1 ? '1 Gruppe' : m.groups.length + ' Gruppen (' + m.groups.join('/') + ')';
    var fmt = m.legs === 2 ? 'Hin- & Rückrunde' : 'jeder gegen jeden';
    var ko = [];
    for (var n = m.qualifiers; n >= 2; n /= 2) ko.push(STAGE_NAMES[n]);
    var perGroup = Math.floor(m.qualifiers / m.groups.length);
    var ll = m.qualifiers - perGroup * m.groups.length;
    return g + ', ' + fmt + ' → ' + ko.join(', ') + (ll ? ' (+' + ll + ' Lucky Loser)' : '');
  }

  /* ---------- Round-Robin (Kreis-Methode) ---------- */
  function roundRobin(ids) {
    var list = ids.slice();
    if (list.length % 2) list.push(null);
    var n = list.length, rounds = [];
    for (var r = 0; r < n - 1; r++) {
      var pairs = [];
      for (var i = 0; i < n / 2; i++) {
        var a = list[i], b = list[n - 1 - i];
        if (a && b) pairs.push(r % 2 ? [b, a] : [a, b]);
      }
      rounds.push(pairs);
      list.splice(1, 0, list.pop());
    }
    return rounds;
  }

  /* ---------- 4. Seitenvergabe ---------- */
  function sideCounts(state, teamId) {
    var a = 0, b = 0;
    state.matches.forEach(function (m) {
      var side = m.homeTeamId === teamId ? m.sideAssignment.homeTeamSide
        : m.awayTeamId === teamId ? m.sideAssignment.awayTeamSide : null;
      if (side === 'side_a') a++; else if (side === 'side_b') b++;
    });
    return { teamId: teamId, sideA_count: a, sideB_count: b, difference: a - b };
  }

  // 4.2: Wer öfter auf A war, spielt auf B. Gleichstand: höher gesetztes Team
  // (niedrigerer seed) bzw. alphabetisch bekommt A.
  function assignSides(state, homeId, awayId, tiebreakHomeA) {
    var h = sideCounts(state, homeId).difference, w = sideCounts(state, awayId).difference;

    }

  }

  function matchById(state, id) { return state.matches.find(function (m) { return m.id === id; }); }

      label: opts.label || null,
      homeTeamId: opts.homeTeamId,
      awayTeamId: opts.awayTeamId,
      sideAssignment: null,
      result: null,
      throwSequence: [],
      playerOrder: null,
      startingTeamId: null,
      status: 'not_started',
      createdAt: now(),
      updatedAt: now()
    };
    m.sideAssignment = assignSides(state, m.homeTeamId, m.awayTeamId, opts.tiebreakHomeA);
    state.matches.push(m);
    return m;
  }

  /* ---------- Turnier erstellen ---------- */
  // input: { name, date, thirdPlace, teams: [{ name, players: [name, name] }] }
  function createTournament(input) {
    var count = input.teams.length;
    var mode = getMode(count);
    if (!mode) throw new Error('Es werden 2 bis 12 Teams unterstützt.');
    var t = {
      id: uuid(),
      name: input.name,
      date: input.date,
      mode: mode.series ? 'knockout' : mode.groups.length ? 'groups_with_knockout' : 'group',
      teamCount: count,
      status: 'in_progress',
      config: {
        groups: mode.groups.slice(),
        legs: mode.legs || 0,
        qualifiers: mode.qualifiers || 0,
        series: mode.series || 0,
        thirdPlace: input.thirdPlace != null ? !!input.thirdPlace : !!mode.thirdPlace
      },
      settings: { autoSwitch: true },
      groups: [],
      knockoutStages: [],
      createdAt: now(),
      updatedAt: now()
    };
    var state = { tournament: t, teams: [], players: [], matches: [] };

    input.teams.forEach(function (ti) {
      var team = { id: uuid(), tournamentId: t.id, name: ti.name, players: [], seed: null, createdAt: now() };
      ti.players.forEach(function (pn) {
        var p = { id: uuid(), teamId: team.id, name: pn, createdAt: now() };
        state.players.push(p);
        team.players.push(p.id);
      });
      state.teams.push(team);
    });

    if (mode.series) {
      var st = { id: uuid(), tournamentId: t.id, stageName: 'Best of ' + mode.series, kind: 'series', size: 2, createdAt: now() };
      t.knockoutStages.push(st);
      newMatch(state, { knockoutStageId: st.id, homeTeamId: state.teams[0].id, awayTeamId: state.teams[1].id, label: 'Spiel 1', slot: 0 });
      return state;
    }

    // Teams zufällig auf Gruppen verteilen
    var shuffled = state.teams.map(function (x) { return x.id; });
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    var idx = 0;
    mode.groups.forEach(function (size, gi) {
      t.groups.push({
        id: uuid(), tournamentId: t.id,
        name: 'Gruppe ' + String.fromCharCode(65 + gi),
        teamIds: shuffled.slice(idx, idx + size),
        createdAt: now()
      });
      idx += size;
    });

    // Spielplan: Runden gruppenübergreifend verschränken, damit alle Gruppen parallel laufen
    var legs = [];
    t.groups.forEach(function (g) {
      var rounds = roundRobin(g.teamIds);
      var all = rounds.slice();
      if (mode.legs === 2) all = all.concat(rounds.map(function (r) { return r.map(function (p) { return [p[1], p[0]]; }); }));
      legs.push({ g: g, rounds: all, first: rounds.length });
    });
    var maxRounds = Math.max.apply(null, legs.map(function (l) { return l.rounds.length; }));
    var matchday = 1;
    for (var r = 0; r < maxRounds; r++) {
      legs.forEach(function (l) {
        (l.rounds[r] || []).forEach(function (pair) {
          var tiebreak;
          if (r >= l.first) {
            // Rückspiel: Seiten gegenüber dem Hinspiel tauschen
            var first = state.matches.find(function (m) {
              return m.groupId === l.g.id && m.homeTeamId === pair[1] && m.awayTeamId === pair[0];
            });
            if (first) tiebreak = first.sideAssignment.awayTeamSide === 'side_a';
          }
          var m = newMatch(state, { groupId: l.g.id, homeTeamId: pair[0], awayTeamId: pair[1], tiebreakHomeA: tiebreak });
          m.matchday = matchday + r;
        });
      });
    }
    return state;
  }

  /* ---------- Ergebnis & Statistik ---------- */
  function matchTotals(match) {
    var tot = {};
    tot[match.homeTeamId] = { hits: 0, throws: 0 };
    tot[match.awayTeamId] = { hits: 0, throws: 0 };
    match.throwSequence.forEach(function (e) {
      var x = tot[e.teamId];
      if (!x) return;
      x.throws++;
      if (e.isHit) x.hits++;
    });
    return tot;
  }

  function buildResult(match, winnerTeamId) {
    var tot = matchTotals(match), h = tot[match.homeTeamId], a = tot[match.awayTeamId];
    return {
      winnerTeamId: winnerTeamId,
      homeTeamHits: h.hits, homeTeamThrows: h.throws,
      awayTeamHits: a.hits, awayTeamThrows: a.throws,
      homeTeamQuote: quote(h.hits, h.throws),
      awayTeamQuote: quote(a.hits, a.throws)
    };
  }

  function emptyTeamStats(teamId) {
    return { teamId: teamId, points: 0, matchesPlayed: 0, wins: 0, losses: 0, hitsTotal: 0, throwsTotal: 0, hitQuote: 0 };
  }
  function addMatchToTeamStats(s, m) {
    if (m.status !== 'completed' || !m.result) return;
    var home = m.homeTeamId === s.teamId;
    if (!home && m.awayTeamId !== s.teamId) return;
    s.matchesPlayed++;
    if (m.result.winnerTeamId === s.teamId) { s.wins++; s.points++; } else s.losses++;
    s.hitsTotal += home ? m.result.homeTeamHits : m.result.awayTeamHits;
    s.throwsTotal += home ? m.result.homeTeamThrows : m.result.awayTeamThrows;
    s.hitQuote = quote(s.hitsTotal, s.throwsTotal);
  }

  // 5.3: Punkte ↓, Quote ↓, alphabetisch
  function compareStandings(state) {
    return function (a, b) {
      return (b.points - a.points) || (b.hitQuote - a.hitQuote) ||
        teamById(state, a.teamId).name.localeCompare(teamById(state, b.teamId).name, 'de');
    };
  }

  function groupStandings(state, group) {
    var rows = group.teamIds.map(emptyTeamStats);
    state.matches.forEach(function (m) {
      if (m.groupId !== group.id) return;
      rows.forEach(function (r) { addMatchToTeamStats(r, m); });
    });
    rows.sort(compareStandings(state));
    rows.forEach(function (r, i) { r.rank = i + 1; r.groupId = group.id; });
    return rows;
  }

  function teamStats(state) {
    var rows = state.teams.map(function (t) { var r = emptyTeamStats(t.id); r.penalties = emptyPenaltyCounts(); return r; });
    state.matches.forEach(function (m) {
      rows.forEach(function (r) { addMatchToTeamStats(r, m); });
      (m.penalties || []).forEach(function (p) {
        var r = rows.find(function (x) { return x.teamId === p.teamId; });
        if (r) r.penalties[p.type]++;
      });
    });
    return rows.sort(compareStandings(state));
  }

  function playerStats(state) {
    var map = {};
    state.players.forEach(function (p) {
      map[p.id] = { playerId: p.id, name: p.name, teamId: p.teamId, throwsTotal: 0, hitsTotal: 0, hitQuote: 0,
        matchesPlayed: 0, wins: 0, losses: 0, throwsByMatch: {}, hitsByMatch: {}, penalties: emptyPenaltyCounts() };
    });
    state.matches.forEach(function (m) {
      m.throwSequence.forEach(function (e) {
        var s = map[e.playerId];
        if (!s) return;
        s.throwsTotal++;
        s.throwsByMatch[m.id] = (s.throwsByMatch[m.id] || 0) + 1;
        if (e.isHit) { s.hitsTotal++; s.hitsByMatch[m.id] = (s.hitsByMatch[m.id] || 0) + 1; }
      });
      (m.penalties || []).forEach(function (p) { if (p.playerId && map[p.playerId]) map[p.playerId].penalties[p.type]++; });
      if (m.status !== 'completed' || !m.result) return;
      [m.homeTeamId, m.awayTeamId].forEach(function (tid) {
        teamById(state, tid).players.forEach(function (pid) {
          var s = map[pid];
          s.matchesPlayed++;
          if (m.result.winnerTeamId === tid) s.wins++; else s.losses++;
        });
      });
    });
    return Object.keys(map).map(function (k) {
      var s = map[k];
      s.hitQuote = quote(s.hitsTotal, s.throwsTotal);
      return s;
    });
  }

  // 5.4: Quote (mit Mindestwürfen) ↓, Treffer ↓
  function playerRanking(state, minThrows) {
    minThrows = minThrows == null ? 5 : minThrows;
    return playerStats(state).sort(function (a, b) {
      var qa = a.throwsTotal >= minThrows, qb = b.throwsTotal >= minThrows;
      if (qa !== qb) return qa ? -1 : 1;
      return (b.hitQuote - a.hitQuote) || (b.hitsTotal - a.hitsTotal) || a.name.localeCompare(b.name, 'de');
    });
  }

  /* ---------- Turnierübergreifend ---------- */
  // Spieler und Teams haben pro Turnier eigene IDs – zusammengeführt wird über den Namen.
  function nameKey(name) { return String(name || '').trim().toLowerCase(); }

  function careerStats(states, minThrows) {
    minThrows = minThrows == null ? 5 : minThrows;
    var players = {}, teams = {};
    function entry(map, name) {
      var k = nameKey(name);
      return map[k] || (map[k] = { name: String(name).trim(), tournaments: 0, titles: 0, podiums: 0, throwsTotal: 0, hitsTotal: 0,
        matchesPlayed: 0, wins: 0, losses: 0, penalties: emptyPenaltyCounts(), teamNames: [], lastDate: '' });
    }
    function addCommon(e, s, st, place) {
      e.tournaments++;
      e.throwsTotal += s.throwsTotal; e.hitsTotal += s.hitsTotal;
      e.matchesPlayed += s.matchesPlayed; e.wins += s.wins; e.losses += s.losses;
      Object.keys(e.penalties).forEach(function (k) { e.penalties[k] += s.penalties[k] || 0; });
      if (place === 1) e.titles++;
      if (place) e.podiums++;
      if ((st.tournament.date || '') > e.lastDate) e.lastDate = st.tournament.date || '';
    }
    states.forEach(function (st) {
      var places = {};
      podium(st).forEach(function (p) { places[p.teamId] = p.place; });
      teamStats(st).forEach(function (s) { addCommon(entry(teams, teamById(st, s.teamId).name), s, st, places[s.teamId]); });
      playerStats(st).forEach(function (s) {
        var e = entry(players, s.name), tn = teamById(st, s.teamId).name;
        addCommon(e, s, st, places[s.teamId]);
        if (e.teamNames.indexOf(tn) < 0) e.teamNames.push(tn);
      });
    });
    function finish(map) {
      return Object.keys(map).map(function (k) {
        var e = map[k];
        e.hitQuote = quote(e.hitsTotal, e.throwsTotal);
        e.winQuote = quote(e.wins, e.matchesPlayed);
        return e;
      }).sort(function (a, b) {
        var qa = a.throwsTotal >= minThrows, qb = b.throwsTotal >= minThrows;
        if (qa !== qb) return qa ? -1 : 1;
        return (b.hitQuote - a.hitQuote) || (b.hitsTotal - a.hitsTotal) || a.name.localeCompare(b.name, 'de');
      });
    }
    return { players: finish(players), teams: finish(teams).sort(function (a, b) {
      return (b.titles - a.titles) || (b.wins - a.wins) || (b.winQuote - a.winQuote) || a.name.localeCompare(b.name, 'de');
    }) };
  }

  /* ---------- Phasen & K.o. ---------- */
  function groupMatches(state) { return state.matches.filter(function (m) { return m.groupId; }); }
  function stageMatches(state, stageId) {
    return state.matches.filter(function (m) { return m.knockoutStageId === stageId; })
      .sort(function (a, b) { return a.slot - b.slot; });
  }
  function allDone(ms) { return ms.length > 0 && ms.every(function (m) { return m.status === 'completed'; }); }
  function winnerOf(m) { return m.result && m.result.winnerTeamId; }
  function loserOf(m) { return m.result && (m.result.winnerTeamId === m.homeTeamId ? m.awayTeamId : m.homeTeamId); }

  // 1.2/1.3: Gruppensieger, dann beste Zweite/Dritte (Lucky Loser)
  function qualifiers(state) {
    var t = state.tournament, Q = t.config.qualifiers, G = t.groups.length;
    var perGroup = Math.floor(Q / G);
    var tables = t.groups.map(function (g) { return groupStandings(state, g); });
    var chosen = [];
    tables.forEach(function (rows) { chosen = chosen.concat(rows.slice(0, perGroup)); });
    var rest = Q - chosen.length;
    var luckyLosers = [];
    if (rest > 0) {
      var pool = [];
      tables.forEach(function (rows) { if (rows[perGroup]) pool.push(rows[perGroup]); });
      pool.sort(crossGroupCompare(state));
      luckyLosers = pool.slice(0, rest);
      luckyLosers.forEach(function (r) { r.luckyLoser = true; });
      chosen = chosen.concat(luckyLosers);
    }
    // Setzliste: Platzierung in der Gruppe, dann Punkte/Spiel, Quote, Name
    chosen.sort(function (a, b) { return (a.rank - b.rank) || crossGroupCompare(state)(a, b); });
    return chosen;
  }
  // Gruppen können unterschiedlich groß sein (11 Teams) → Punkte pro Spiel vergleichen
  function crossGroupCompare(state) {
    return function (a, b) {
      var pa = a.matchesPlayed ? a.points / a.matchesPlayed : 0, pb = b.matchesPlayed ? b.points / b.matchesPlayed : 0;
      return (pb - pa) || (b.hitQuote - a.hitQuote) ||
        teamById(state, a.teamId).name.localeCompare(teamById(state, b.teamId).name, 'de');
    };
  }

  // Standard-Setzbaum: 1 und 2 treffen frühestens im Finale aufeinander
  function bracketOrder(n) {
    var order = [1];
    while (order.length < n) {
      var size = order.length * 2, next = [];
      order.forEach(function (s) { next.push(s, size + 1 - s); });
      order = next;
    }
    return order;
  }

  function firstRoundPairs(seeded) {
    var n = seeded.length, order = bracketOrder(n), pairs = [];
    for (var i = 0; i < n; i += 2) pairs.push([seeded[order[i] - 1], seeded[order[i + 1] - 1]]);
    // Gleiche Gruppe in Runde 1 vermeiden, indem die schwächer gesetzten Teams getauscht werden
    if (pairs.length > 1) {
      pairs.forEach(function (p, i) {
        if (p[0].groupId !== p[1].groupId) return;
        for (var j = pairs.length - 1; j >= 0; j--) {
          if (j === i) continue;
          var q = pairs[j];
          if (q[1].groupId !== p[0].groupId && p[1].groupId !== q[0].groupId) {
            var tmp = p[1]; p[1] = q[1]; q[1] = tmp;
            return;
          }
        }
      });
    }
    return pairs;
  }

  function addStage(state, size, kind) {
    var st = { id: uuid(), tournamentId: state.tournament.id, stageName: kind === 'third' ? 'Spiel um Platz 3' : STAGE_NAMES[size],
      kind: kind || 'main', size: size, createdAt: now() };
    state.tournament.knockoutStages.push(st);
    return st;
  }

  function mainStages(state) {
    return state.tournament.knockoutStages.filter(function (s) { return s.kind === 'main'; });
  }

  // Nach jeder Ergebnis-Änderung aufrufen: erzeugt ggf. nächste Runde / beendet Turnier
  function advance(state) {
    var t = state.tournament, changed = false;
    if (t.status === 'completed') return false;

    if (t.config.series) {
      var st = t.knockoutStages[0], ms = stageMatches(state, st.id);
      var need = Math.ceil(t.config.series / 2), wins = {};
      ms.forEach(function (m) { if (winnerOf(m)) wins[winnerOf(m)] = (wins[winnerOf(m)] || 0) + 1; });
      var champion = Object.keys(wins).find(function (k) { return wins[k] >= need; });
      if (champion) { t.status = 'completed'; return true; }
      if (allDone(ms)) {
        var last = ms[ms.length - 1];
        newMatch(state, { knockoutStageId: st.id, homeTeamId: last.awayTeamId, awayTeamId: last.homeTeamId,
          slot: ms.length, label: 'Spiel ' + (ms.length + 1) });
        return true;
      }
      return false;
    }

    var stages = mainStages(state);
    if (!stages.length) {
      if (!allDone(groupMatches(state))) return false;
      var seeded = qualifiers(state);
      seeded.forEach(function (row, i) { teamById(state, row.teamId).seed = i + 1; });
      var first = addStage(state, seeded.length);
      firstRoundPairs(seeded).forEach(function (p, i) {
        newMatch(state, { knockoutStageId: first.id, homeTeamId: p[0].teamId, awayTeamId: p[1].teamId, slot: i });
      });
      // Spiel um Platz 3 ohne Halbfinale (4 Teams): Gruppendritter gegen -vierter
      if (seeded.length === 2 && t.config.thirdPlace && t.groups.length === 1) {
        var table = groupStandings(state, t.groups[0]);
        if (table.length >= 4) {
          var third = addStage(state, 2, 'third');
          newMatch(state, { knockoutStageId: third.id, homeTeamId: table[2].teamId, awayTeamId: table[3].teamId, slot: 0 });
        }
      }
      return true;
    }

    var cur = stages[stages.length - 1], cms = stageMatches(state, cur.id);
    if (!allDone(cms)) return false;
    if (cur.size === 2) {
      var thirdStage = t.knockoutStages.find(function (s) { return s.kind === 'third'; });
      if (!thirdStage || allDone(stageMatches(state, thirdStage.id))) { t.status = 'completed'; changed = true; }
      return changed;
    }
    var next = addStage(state, cur.size / 2);
    for (var i = 0; i < cms.length; i += 2) {
      newMatch(state, { knockoutStageId: next.id, homeTeamId: winnerOf(cms[i]), awayTeamId: winnerOf(cms[i + 1]), slot: i / 2 });
    }
    if (cur.size === 4 && t.config.thirdPlace) {
      var ts = addStage(state, 2, 'third');
      newMatch(state, { knockoutStageId: ts.id, homeTeamId: loserOf(cms[0]), awayTeamId: loserOf(cms[1]), slot: 0 });
    }
    return true;
  }

  // Endplatzierung (1–3), sofern schon ermittelt
  function podium(state) {
    var t = state.tournament, res = [];
    if (t.config.series) {
      var st = t.knockoutStages[0], wins = {};
      stageMatches(state, st.id).forEach(function (m) { if (winnerOf(m)) wins[winnerOf(m)] = (wins[winnerOf(m)] || 0) + 1; });
      if (t.status !== 'completed') return res;
      var ids = state.teams.map(function (x) { return x.id; }).sort(function (a, b) { return (wins[b] || 0) - (wins[a] || 0); });
      return [{ place: 1, teamId: ids[0] }, { place: 2, teamId: ids[1] }];
    }
    var final = mainStages(state).find(function (s) { return s.size === 2; });
    var fm = final && stageMatches(state, final.id)[0];
    if (fm && fm.status === 'completed') res.push({ place: 1, teamId: winnerOf(fm) }, { place: 2, teamId: loserOf(fm) });
    var third = t.knockoutStages.find(function (s) { return s.kind === 'third'; });
    var tm = third && stageMatches(state, third.id)[0];
    if (tm && tm.status === 'completed') res.push({ place: 3, teamId: winnerOf(tm) });
    return res;
  }

  function phaseLabel(state) {
    var t = state.tournament;
    if (t.status === 'completed') return 'Turnier beendet';
    if (t.config.series) {
      var n = stageMatches(state, t.knockoutStages[0].id).length;
      return 'Best of ' + t.config.series + ', Spiel ' + n;
    }
    var stages = mainStages(state);
    if (!stages.length) {
      var open = groupMatches(state).filter(function (m) { return m.status !== 'completed'; });
      var day = open.length ? Math.min.apply(null, open.map(function (m) { return m.matchday; })) : '';
      return 'Gruppenphase' + (day ? ', Spieltag ' + day : '');
    }
    return stages[stages.length - 1].stageName;
  }

  var PENALTY_TYPES = {
    warning: 'Verwarnung',
    skip_player: 'Aussetzen',
    skip_team: 'Teamaussetzen',
    strafhalbe: 'Strafhalbe'
  };
  // Diese Strafen gelten für das ganze Team, die übrigen für einen Spieler
  var TEAM_PENALTIES = { warning: true, skip_team: true };

  // Wurfreihenfolge: Teams werfen abwechselnd, innerhalb des Teams wird rotiert (3.2)
  function nextThrower(match) {
    if (!match.playerOrder || !match.startingTeamId) return null;
    var seq = match.throwSequence, last = seq[seq.length - 1];
    var teamId = last ? (last.teamId === match.homeTeamId ? match.awayTeamId : match.homeTeamId) : match.startingTeamId;
    var n = seq.filter(function (e) { return e.teamId === teamId; }).length;
    var order = match.playerOrder[teamId];
    return { teamId: teamId, playerId: order[n % order.length] };
  }

  // Aussetzen/Teamaussetzen: Spieler bzw. Team darf beim nächsten Treffer der eigenen
  // Mannschaft nicht trinken. Liefert den Wurf, bei dem die Strafe abgegolten wurde, sonst null.
  function drinkBanServedAt(match, penalty) {
    if (penalty.type !== 'skip_player' && penalty.type !== 'skip_team') return null;
    var seq = match.throwSequence;
    for (var i = penalty.beforeThrow; i < seq.length; i++) {
      if (seq[i].teamId === penalty.teamId && seq[i].isHit) return seq[i];
    }
    return null;
  }

  // Spieler, die beim nächsten Treffer ihres Teams nicht trinken dürfen
  function pendingDrinkBans(match, state) {
    var banned = {};
    (match.penalties || []).forEach(function (p) {
      if ((p.type !== 'skip_player' && p.type !== 'skip_team') || drinkBanServedAt(match, p)) return;
      var ids = p.type === 'skip_team' ? match.playerOrder[p.teamId] || teamById(state, p.teamId).players : [p.playerId];
      ids.forEach(function (id) { banned[id] = true; });
    });
    return banned;
  }

  function recordThrow(match, playerId, teamId, isHit) {
    match.throwSequence.push({ id: uuid(), matchId: match.id, playerId: playerId, teamId: teamId,
      throwNumber: match.throwSequence.length + 1, isHit: !!isHit, timestamp: now() });
    match.updatedAt = now();
  }

  function addPenalty(match, type, teamId, playerId) {
    if (!PENALTY_TYPES[type]) throw new Error('Unbekannte Strafe: ' + type);
    if (!match.penalties) match.penalties = [];
    match.penalties.push({ id: uuid(), matchId: match.id, type: type, teamId: teamId,
      playerId: TEAM_PENALTIES[type] ? null : playerId, beforeThrow: match.throwSequence.length, timestamp: now() });
    var pen = match.penalties[match.penalties.length - 1];
    if (type === 'warning') applyWarningConsequences(match, pen);
    match.updatedAt = now();
  }

  // Mahn-Konto: 4 Verwarnungen -> Teamaussetzen, 8 Verwarnungen -> Strafhalbe für jedes
  // Team-Mitglied, danach wird das Konto auf Null gesetzt. Folgestrafen verweisen per causedBy
  // auf die auslösende Verwarnung und verschwinden mit ihr.
  function warningCount(match, teamId) {
    return (match.penalties || []).filter(function (p) { return p.type === 'warning' && p.teamId === teamId; }).length;
  }
  function warningAccount(match, teamId) { return warningCount(match, teamId) % 8; }

  function applyWarningConsequences(match, warning) {
    var n = warningCount(match, warning.teamId) % 8;
    function auto(type, playerId) {
      match.penalties.push({ id: uuid(), matchId: match.id, type: type, teamId: warning.teamId, playerId: playerId || null,
        beforeThrow: warning.beforeThrow, timestamp: warning.timestamp, causedBy: warning.id });
    }
    if (n === 4) auto('skip_team');
    else if (n === 0) (match.playerOrder && match.playerOrder[warning.teamId] || []).forEach(function (pid) { auto('strafhalbe', pid); });
  }

  // Wurf nachträglich ändern (Spieler/Team, Treffer)

/* Flankenscore – Persistierung in localStorage (7.2)
 * Jedes Turnier liegt unter einem eigenen Schlüssel, damit der Verlauf erhalten bleibt
 * und beim Speichern nur das aktive Turnier neu geschrieben wird. */
(function (global) {
  'use strict';
  var LEGACY_KEY = 'flankenscore_tournament';
  var INDEX_KEY = 'flankenscore_index';     // [tournamentId, ...]
  var ACTIVE_KEY = 'flankenscore_active';   // tournamentId oder leer
  var PREFIX = 'flankenscore_t_';

  /* In der Android-App (Capacitor) wird jede Änderung zusätzlich in den nativen Preferences
   * gesichert. Android darf den WebView-Speicher leeren – dann wird beim Start daraus wiederhergestellt. */
  var Cap = global.Capacitor;
  var isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  // Ohne Bundler: native Plugins direkt über die Capacitor-Bridge registrieren
  function plugin(name) { return Cap.Plugins[name] || Cap.registerPlugin(name); }
  var Prefs = isNative && plugin('Preferences');

  function get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function set(key, val) {
    localStorage.setItem(key, val);
    if (Prefs) Prefs.set({ key: key, value: val }).catch(function (e) { console.warn('Native Sicherung fehlgeschlagen', e); });
  }
  function del(key) {
    try { localStorage.removeItem(key); } catch (e) { /* ignorieren */ }
    if (Prefs) Prefs.remove({ key: key }).catch(function () { /* ignorieren */ });
  }

  // Vor dem ersten load() aufrufen: stellt fehlende Einträge aus der nativen Sicherung wieder her
  function ready() {
    if (!Prefs) return Promise.resolve();
    return Prefs.keys().then(function (res) {
      var missing = res.keys.filter(function (k) { return isStorageKey(k) && get(k) == null; });
      return Promise.all(missing.map(function (k) {
        return Prefs.get({ key: k }).then(function (r) { if (r.value != null) localStorage.setItem(k, r.value); });
      }));
    }).catch(function (e) { console.warn('Native Sicherung konnte nicht gelesen werden', e); });
  }

  function index() {
    try { var ids = JSON.parse(get(INDEX_KEY) || '[]'); return Array.isArray(ids) ? ids : []; }
    catch (e) { return []; }
  }

  function write(state) {
    var id = state.tournament.id, ids = index();
    set(PREFIX + id, JSON.stringify(state));
    if (ids.indexOf(id) < 0) { ids.push(id); set(INDEX_KEY, JSON.stringify(ids)); }
  }

  // Alten Einzel-Speicherstand in den Verlauf übernehmen
  function migrate() {
    var raw = get(LEGACY_KEY);
    if (!raw) return;
    try {
      var state = validate(JSON.parse(raw));
      write(state);
      set(ACTIVE_KEY, state.tournament.id);
    } catch (e) { console.warn('Alter Speicherstand konnte nicht übernommen werden', e); return; }
    del(LEGACY_KEY);
  }

  function read(id) {
    try {
      var raw = get(PREFIX + id);
      return raw ? validate(JSON.parse(raw)) : null;
    } catch (e) {
      console.warn('Turnier ' + id + ' konnte nicht geladen werden', e);
      return null;
    }
  }

  function load() {
    migrate();
    var id = get(ACTIVE_KEY);
    return id ? read(id) : null;
  }

  // Speichert das Turnier und macht es zum aktiven; null schließt das aktive Turnier (bleibt im Verlauf)
  function save(state) {
    if (!state) { del(ACTIVE_KEY); return; }
    state.tournament.updatedAt = Flanken.now();
    try { write(state); set(ACTIVE_KEY, state.tournament.id); }
    catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }

  // Alle gespeicherten Turniere, neueste zuerst
  function list() {
    return index().map(read).filter(Boolean).sort(function (a, b) {
      return String(b.tournament.date || '').localeCompare(String(a.tournament.date || '')) ||
        String(b.tournament.createdAt || '').localeCompare(String(a.tournament.createdAt || ''));
    });
  }

  function remove(id) {
    del(PREFIX + id);
    set(INDEX_KEY, JSON.stringify(index().filter(function (x) { return x !== id; })));
    if (get(ACTIVE_KEY) === id) del(ACTIVE_KEY);
  }

  function isStorageKey(key) { return key === ACTIVE_KEY || key === INDEX_KEY || (key || '').indexOf(PREFIX) === 0; }

  function validate(data) {
    if (!data || !data.tournament || !Array.isArray(data.teams) || !Array.isArray(data.matches) || !Array.isArray(data.players)) {
      throw new Error('Ungültige Turnierdatei');
    }
    return data;
  }

  // Android: Datei in den Cache schreiben und über das Teilen-Menü anbieten (Speichern, Drive, Messenger …)
  function share(name, blob) {
    return blob.text().then(function (text) {
      return plugin('Filesystem').writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
    }).then(function (res) {
      return plugin('Share').share({ title: name, url: res.uri, dialogTitle: name });
    }).catch(function (e) {

    });
  }

  function download(name, blob) {
    if (isNative) { share(name, blob); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  function exportJson(state) {
    var safe = (state.tournament.name || 'turnier').replace(/[^\w\-äöüÄÖÜß]+/g, '_');
    download('flankenscore_' + safe + '_' + (state.tournament.date || '') + '.json',
      new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  }

  function importJson(file) {
    return file.text().then(function (txt) { return validate(JSON.parse(txt)); });
  }

  global.FlankenStore = { isNative: isNative, ready: ready, load: load, save: save, list: list, remove: remove, isStorageKey: isStorageKey,
    download: download, exportJson: exportJson, importJson: importJson };
})(window);
