<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>Flankenscore</title>
  <link rel="icon" type="image/svg+xml" href="assets/flankenscore-logo.svg">
  <link rel="manifest" href="manifest.webmanifest" data-pwa>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" data-pwa>
  <meta name="apple-mobile-web-app-capable" content="yes" data-pwa>
  <meta name="mobile-web-app-capable" content="yes" data-pwa>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-pwa>
  <meta name="apple-mobile-web-app-title" content="Flankenscore" data-pwa>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="#/"><img class="brand-logo" src="assets/flankenscore-logo.svg" alt="" width="53" height="38" style="height:38px;width:auto"><span class="brand-text">Flanken<span>score</span></span></a>
    <nav id="nav"></nav>
  </header>
  <main id="app">
    <section class="card">
      <h1>Flankenscore startet nicht?</h1>
      <p>Diese Seite braucht JavaScript. Wenn du diesen Text siehst, wird die Datei vermutlich nur in einer Vorschau angezeigt (z.B. Dateien-App, Mail oder Messenger auf iPhone/iPad).</p>
      <p>Öffne die Datei stattdessen direkt in einem Browser wie Safari oder Chrome.</p>
    </section>
  </main>
  <script>
    // Nur Startfehler anzeigen: Läuft die App schon, soll ein Fehler (z.B. aus Safaris Teilen-Menü
    // oder Browser-Erweiterungen, gemeldet als "Script error.") nicht die ganze Seite ersetzen.
    window.onerror = function (msg, src, line) {
      if (window.flankenStarted || !src) return;
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<section class="card"><h1>Fehler beim Starten</h1><p>' +
        String(msg).replace(/</g, '&lt;') + ' (Zeile ' + line + ')</p><p>Bitte diese Meldung weitergeben.</p></section>';
    };
  </script>
  <!-- Regelwerk als Overlay: liegt über der App, das laufende Spiel bleibt unverändert -->
  <div id="rulesOverlay" class="rules-overlay" hidden>
    <iframe id="rulesFrame" title="Regelwerk" data-src="regelwerk.html"></iframe>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script data-pwa>
    // Offline-Nutzung als Web-App (nicht in der Android-App und nicht als lokale Datei)
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !(window.Capacitor && Capacitor.isNativePlatform())) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
